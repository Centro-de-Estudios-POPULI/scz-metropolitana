     El caso que lo resume: Santa Cruz de la Sierra tiene 63,9% de
     alcantarillado con su decil de abajo en 0% y el de arriba en 100% — el
     promedio municipal no describe a casi nadie.
     Antes, este lugar del panel repetía nombre, valor y orden de las barras.

   El eje es PROPIO y va rotulado: las distribuciones de manzana son mucho más
   anchas que el rango de los nueve promedios, así que forzarlas al eje de
   arriba las recortaría. El color sí es compartido — sale de la escala del
   nivel manzana, que es la que pinta el mapa cuando bajás. */
function distribucion(ind){
  if (!MZS || !ind.k_mz) return "";
  const st = MZS[ind.k_mz];
  if (!st || !st.dist) return "";
  const eMz = escalaManzana(ind);
  /* ⚠️ EL MISMO ORDEN QUE EL COMPARATIVO, no el propio. Ordenar por mediana
     parecía lo natural, pero deja las filas de arriba y las de abajo
     desalineadas y entonces hay que buscar cada municipio dos veces: se pierde
     justo la lectura que motiva la tira —cuánto arriba, qué tan parejo
     abajo—. Con el orden compartido, cada fila se lee en vertical. */
  const filas = MUN.map(m => ({m, d: st.dist[m.sigep], v: valorParaMini(m, ind)}))
    .filter(f => f.d)
    .sort((a, b) => (b.v === null ? -Infinity : b.v) - (a.v === null ? -Infinity : a.v));
  if (filas.length < 2) return "";

  const lo = Math.min(...filas.map(f => f.d.p10));
  const hi = Math.max(...filas.map(f => f.d.p90));
  const rango = (hi - lo) || 1;
  const H = 11.5, W = 100, LX = 35, VX = 82;
  const alto = filas.length * H + 11;
  const x = v => LX + ((v - lo) / rango) * (VX - LX);

  let s = "";
  filas.forEach((f, k) => {
    const y = k * H + 3, d = f.d, sel_ = f.m.sigep === sel;
    const corto = f.m.nombre.length > 16 ? f.m.nombre.slice(0, 15) + "…" : f.m.nombre;
    s += `<text x="0" y="${y + 5.4}" class="cmp-n${sel_ ? " sel" : ""}">${corto}</text>`;
    const x10 = x(d.p10), x25 = x(d.p25), x50 = x(d.p50), x75 = x(d.p75), x90 = x(d.p90);
    // bigote p10–p90: el 80% central de las manzanas del municipio
    s += `<line x1="${x10}" y1="${y + 4}" x2="${x90}" y2="${y + 4}" class="ds-w"/>`;
    s += `<line x1="${x10}" y1="${y + 1.8}" x2="${x10}" y2="${y + 6.2}" class="ds-w"/>`;
    s += `<line x1="${x90}" y1="${y + 1.8}" x2="${x90}" y2="${y + 6.2}" class="ds-w"/>`;
    // caja p25–p75, con el tono que le toca a la mediana en el mapa
    s += `<rect x="${x25}" y="${y + 1.2}" width="${Math.max(.5, x75 - x25)}" height="5.6"
            rx="0.6" fill="${tonoDe(eMz, d.p50)}" fill-opacity="${sel_ ? .95 : .72}"
            ${sel_ ? `stroke="${SENAL}" stroke-width="0.7"` : ""}/>`;
    s += `<line x1="${x50}" y1="${y + .6}" x2="${x50}" y2="${y + 7.4}" class="ds-med"/>`;
    // la brecha es el dato nuevo: cuánto separa al decil de arriba del de abajo
    s += `<text x="${W}" y="${y + 5.4}" class="ds-g" text-anchor="end">${
            nf(d.p90 - d.p10, 0)}<tspan class="ds-u"> ${unidadDif(ind.unit)}</tspan></text>`;
    /* Con las tarjetas fuera, el panel se quedaba sin manera de elegir un
       municipio sin ir al mapa. La fila entera es el blanco. */
    s += `<rect x="0" y="${y}" width="${W}" height="${H - .5}" class="ds-hit"
            data-s="${f.m.sigep}"><title>${f.m.nombre}: la mitad de sus manzanas está entre ${
            fmtM(d.p25, ind)} y ${fmtM(d.p75, ind)}</title></rect>`;
  });
  // los extremos del eje, porque no es el mismo que el de las barras
  const yb = filas.length * H + 8;
  s += `<text x="${LX}" y="${yb}" class="ds-ax">${fmtM(lo, ind)}</text>`
     + `<text x="${VX}" y="${yb}" class="ds-ax" text-anchor="end">${fmtM(hi, ind)}</text>`;
  return `<div class="cmp-t">Cómo se reparte dentro de cada uno<span>${
      nf(st.esc.n, 0)} manzanas con ficha</span></div>
    <svg class="cmp" viewBox="0 0 ${W} ${alto}" preserveAspectRatio="xMidYMin meet">${s}</svg>
    <div class="ds-ley"><span class="ds-k1"></span>80% central de las manzanas
      <span class="ds-k2"></span>mitad más común <span class="ds-k3"></span>mediana</div>`;
}

function serieDe(sigep, ind){
  const e = FIS.entidades[sigep];
  const s = e && e.s && e.s[ind.k_mun];
  return Array.isArray(s) ? s : null;
}
function serieRegion(ind){
  return FIS.anios.map((_, k) => {
    let num = 0, den = 0;
    for (const m of MUN){
      const e = FIS.entidades[m.sigep];
      const s = e && e.s && e.s[ind.k_mun];
      if (!Array.isArray(s)) continue;
      const v = s[k], p = e.pob ? e.pob[k] : 0;
      if (v === null || !isFinite(v) || !isFinite(p) || p <= 0) continue;
      num += v * p; den += p;
    }
    return den > 0 ? num / den : null;
  });
}
function serieSVG(m, ind){
  const sm = serieDe(m.sigep, ind);
  if (!sm) return "";
  const sr = serieRegion(ind), n = FIS.anios.length;
  const hay = v => v !== null && v !== undefined && isFinite(v);
  const todos = sm.filter(hay).concat(sr.filter(hay));
  if (!todos.length) return '<div class="sin">Sin serie para este indicador.</div>';

  let dmin = Math.min(...todos), dmax = Math.max(...todos);
  // Una serie plana tiene rango 0 y dividiría por cero al escalar; el `||` en
  // cadena degrada a un padding relativo y, si el valor también es 0, a 1.
  const pad = (dmax - dmin) * .12 || Math.abs(dmax) * .1 || 1;
  dmin -= pad; dmax += pad;

  const W = 100, LX = 19, RX = 98, T = 5, PH = 33, YB = T + PH, ALTO = 48;
  const paso = (RX - LX) / (n - 1);
  const X = k => LX + k * paso;
  const Y = v => YB - (v - dmin) / (dmax - dmin) * PH;

  /* Un hueco en la serie CORTA el trazo en vez de saltarlo con una recta: unir
     los dos extremos de un año sin dato dibuja una interpolación inventada. */
  const camino = s => {
    let d = "", unido = false;
    s.forEach((v, k) => {
      if (!hay(v)) { unido = false; return; }
      d += (unido ? "L" : "M") + X(k).toFixed(2) + " " + Y(v).toFixed(2) + " ";
      unido = true;
    });
    return d.trim();
  };

  let g = `<line class="ser-base" x1="${LX}" y1="${YB}" x2="${RX}" y2="${YB}"/>`;
  g += `<text class="ser-tk" x="${LX - 2}" y="${T + 2.6}" text-anchor="end">${fmt(dmax, ind.unit)}</text>`;
  g += `<text class="ser-tk" x="${LX - 2}" y="${YB}" text-anchor="end">${fmt(dmin, ind.unit)}</text>`;
  g += `<path class="ser-l reg" d="${camino(sr)}"/>`;
  g += `<path class="ser-l mun" d="${camino(sm)}"/>`;
  sm.forEach((v, k) => { if (hay(v))
    g += `<circle class="ser-d${k === anio_i ? " on" : ""}" cx="${X(k).toFixed(2)}" cy="${Y(v).toFixed(2)}" r="${k === anio_i ? 1.7 : .85}"/>`; });

  // Una sola cifra rotulada —la de la gestión activa—: un número sobre cada uno
  // de los diez puntos es ruido y no se lee.
  const vSel = sm[anio_i];
  if (hay(vSel)){
    const txt = fmt(vSel, ind.unit), tw = txt.length * 2.25;   // ~0,53 em a 4,2px
    const cx = Math.min(Math.max(X(anio_i), LX + tw / 2), W - tw / 2);
    const cy = Y(vSel) - T > 8 ? Y(vSel) - 3.2 : Y(vSel) + 5.6;
    g += `<text class="ser-v" x="${cx.toFixed(2)}" y="${cy.toFixed(2)}" text-anchor="middle">${txt}</text>`;
  }

  // Eje: los extremos y la gestión activa. Los diez años no entran en el ancho
  // del panel, y la activa se omite cuando pisaría a un extremo.
  const etiq = new Set([0, n - 1]);
  if (anio_i >= 2 && anio_i <= n - 3) etiq.add(anio_i);
  [...etiq].sort((a, b) => a - b).forEach(k => {
    const anc = k === 0 ? "start" : k === n - 1 ? "end" : "middle";
    const px = k === 0 ? LX : k === n - 1 ? RX : X(k);
    g += `<text class="ser-ax${k === anio_i ? " on" : ""}" x="${px.toFixed(2)}" y="${YB + 5.4}" text-anchor="${anc}">${FIS.anios[k]}</text>`;
  });

  // Bandas de captura AL FINAL, para que queden encima y reciban el hover. Cada
  // una toma el alto completo del área de dibujo: no hay que acertarle al punto.
  FIS.anios.forEach((y, k) => {
    const x0 = Math.max(LX, X(k) - paso / 2), x1 = Math.min(RX, X(k) + paso / 2);
    const vm = hay(sm[k]) ? fmt(sm[k], ind.unit) : "s/d";
    const vr = hay(sr[k]) ? fmt(sr[k], ind.unit) : "s/d";
    g += `<g class="ser-band" data-i="${k}"><title>${y} · ${m.nombre} ${vm} · región ${vr}</title>` +
         `<rect x="${x0.toFixed(2)}" y="${T}" width="${(x1 - x0).toFixed(2)}" height="${PH}"/>` +
         `<line class="ser-gd" x1="${X(k).toFixed(2)}" y1="${T}" x2="${X(k).toFixed(2)}" y2="${YB}"/></g>`;
  });

  const corto = m.nombre.length > 18 ? m.nombre.slice(0, 17) + "…" : m.nombre;
  return `<div class="cmp-t">Serie fiscal<span>${FIS.anios[0]}–${FIS.anios[n - 1]}</span></div>
    <svg class="ser" viewBox="0 0 ${W} ${ALTO}" preserveAspectRatio="xMidYMin meet">${g}</svg>
    <div class="ser-lg"><span><i></i><b>${corto}</b></span><span><i class="reg"></i>región</span></div>`;
}

/* ── FICHA ───────────────────────────────────────────────────────────────── */
function ficha(e, i){
  const g = document.getElementById("kgrid");
  document.getElementById("cmp").innerHTML = comparativo(e, i);
  /* La distribución va SIEMPRE que el indicador baje a manzana: es la lectura
     que el panel no tenía. Con un municipio elegido queda resaltado, así que
     sirve igual en los dos estados. */
  document.getElementById("dist").innerHTML = distribucion(i);
  if (sel){
    const m = MUN.find(x => x.sigep === sel);
    /* La serie es la trayectoria de UN municipio, así que sólo aparece con uno
       elegido. Sin selección el panel muestra la comparación entre los nueve,
       que es la lectura por defecto de una región. */
    document.getElementById("serie").innerHTML =
      i.fuente === "fiscal" && ANIO === "2024" ? serieSVG(m, i) : "";
    document.getElementById("d-mun").textContent = m.nombre;
    // la población que se rotula es la del censo EN PANTALLA: mostrar la de 2024
    // mientras se mira el mapa de 2012 es una cifra que miente sin avisar
    const pobM = poblacionDe(m);
    document.getElementById("d-sub").textContent =
      `${m.ambito === "núcleo" ? "Núcleo metropolitano" : "Área de influencia"} · `
      + `${nf(pobM, 0)} habitantes${ANIO === "2012" ? " en 2012" : ""}`;
    g.innerHTML = cat_actual.indicadores.filter(x => x.k_mun).map((x, n) => {
      const sinSerie = mudo(x);
      const v = valorMunicipal(m, x);
      const ref = sinSerie ? null : refRegion(x);
      let comp;
      if (sinSerie)
        comp = `<span class="k-w">${motivoSinSerie(x)}</span>`;
      else if (!ref || ref.v === null)
        comp = `<span>${refRegion(x) ? refRegion(x).tipo : "región"} <b>s/d</b></span>`;
      else if (esConteo(x) && ANIO !== "cambio")
        // contra un TOTAL no se lee una diferencia, se lee una parte
        comp = `<span>${ref.tipo} <b>${fmtM(ref.v, x)}</b></span>`
             + `<span>${v !== null && ref.v ? "es el <b>" + nf(100 * v / ref.v, 1) + "%</b>" : ""}</span>`;
      else
        comp = `<span>${ref.tipo} <b>${fmtM(ref.v, x)}</b></span>`
             + flecha(v === null ? null : v - ref.v, uMode(x));
      return `<div class="kpi ${x.key === i.key ? "on" : ""}${sinSerie ? " sin12" : ""}" data-k="${x.key}" style="--d:${Math.min(n,14)*14}ms">
        <div class="k-l">${x.label}</div><div class="k-v">${sinSerie ? "s/d" : fmtM(v, x)}</div>
        <div class="k-c">${comp}</div></div>`;
    }).join("");
  } else {
    document.getElementById("serie").innerHTML = "";
    document.getElementById("d-mun").textContent = "Región Metropolitana";
    // ídem: la población de los 9 se suma del dato. Escrita a mano decía
    // 2.215.919 y el total real del Censo 2024 es 2.282.770.
    const pobR = MUN.reduce((a, m) => a + (poblacionDe(m) || 0), 0);
    document.getElementById("d-sub").textContent =
      `${MUN.length} municipios · ${nf(pobR, 0)} personas`
      + (ANIO === "2012" ? " en 2012" : ANIO === "cambio" ? " en 2024" : "");
    /* ⚠️ ACÁ HABÍA NUEVE TARJETAS QUE REPETÍAN LAS BARRAS: mismo municipio,
       mismo valor, mismo orden, y de nuevo el nombre. Lo único que agregaban
       era el ámbito y el conteo de manzanas.
       Con la distribución arriba ya no hacen falta: si el indicador baja a
       manzana, este lugar lo ocupa una lectura nueva. Si NO baja (los 30
       fiscales, y todo el tablero municipal), las tarjetas siguen siendo la
       forma de recorrer los nueve, así que se conservan para ese caso. */
    if (MZS && i.k_mz && MZS[i.k_mz]){
      g.innerHTML = "";
    } else {
      g.innerHTML = MUN.slice().sort((a,b) => {
        const va = valorMunicipal(a, i), vb = valorMunicipal(b, i);
        return (vb === null ? -1e9 : vb) - (va === null ? -1e9 : va);
      }).map((m, n) => {
        const v = valorMunicipal(m, i);
        return `<div class="kpi" data-s="${m.sigep}" style="--d:${Math.min(n,14)*14}ms">
          <div class="k-l">${m.nombre}</div><div class="k-v">${mudo(i) ? "s/d" : fmtM(v, i)}</div>
          <div class="k-c"><span>${m.ambito}</span><span>${nf(m.manzanas,0)} manzanas</span></div></div>`;
      }).join("");
    }
  }
  g.querySelectorAll(".kpi[data-s]").forEach(el => el.onclick = () => seleccionar(el.dataset.s));
  document.querySelectorAll("#dist .ds-hit").forEach(el =>
    el.onclick = () => seleccionar(el.dataset.s));
  g.querySelectorAll(".kpi[data-k]").forEach(el => el.onclick = () => elegirIndicador(el.dataset.k));
  /* Clicar un año del gráfico hace lo mismo que su botón de gestión. Con eso
     cada valor de la serie se alcanza SIN hover —al fijar la gestión, la cifra
     exacta queda rotulada sobre la línea y en las tarjetas de abajo—, así que
     el tooltip agrega lectura pero no es la única forma de leer el dato. */
  document.querySelectorAll("#serie .ser-band").forEach(el => el.onclick = () => {
    anio_i = +el.dataset.i; montarAnios(); pintar();
  });
}

function seleccionar(s){
  sel = sel === s ? null : s;
  if (map && map.getSource("mun")) map.setFilter("mun-sel", ["==", ["get", "sigep"], sel || ""]);
  if (sel){
    const m = MUN.find(x => x.sigep === sel);
    if (m && m.geom && map){
      // bbox del municipio recorriendo sus coordenadas: sirve para Polygon y
      // MultiPolygon sin ramificar por tipo de geometría.
      const b = bboxDe(m.geom.geometry.coordinates);
      if (b) map.fitBounds(b, {padding: 90, duration: 700});
    }
  } else encuadrar();
  pintar();
}

/* ── TOOLTIP ─────────────────────────────────────────────────────────────────
   Un valor suelto no dice nada: 58,3% de agua por cañería puede ser bueno o malo
   según contra qué se lea. Así que el tooltip no muestra el número, muestra el
   número EN SU LUGAR — el tono que le tocó en la rampa, dónde cae dentro del
   rango, y una o dos referencias explícitas (la región, el urbano del municipio,
   el puesto entre los nueve, el percentil entre las manzanas).
   Mismo molde que el Atlas Socioeconómico y el Fiscal (`#pop` en la hoja
   extraída), así que los tres se leen igual. */

/* Los nombres de localidad vienen del INE en MAYÚSCULAS. Las partículas van en
   minúscula salvo al principio: "SAN MIGUEL DE LOS JUNOS" → "San Miguel de los
   Junos", no "San Miguel De Los Junos". */
/* El slug del municipio es la clave con que la tesela dice a cuál pertenece
   cada manzana (`generar_pmtiles.py` lo toma del nombre de archivo). */
const slugDe = s => s.toLowerCase().normalize("NFD")
  .replace(/[̀-ͯ]/g, "").replace(/ /g, "_");

const PARTICULAS = new Set(["de","del","la","las","los","el","y","en"]);
function tituloCaso(s){
  if (!s) return "";
  return String(s).toLowerCase().split(/\s+/).map((w, k) =>
    k > 0 && PARTICULAS.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}
/* La diferencia entre dos porcentajes NO es un porcentaje, son puntos
   porcentuales: "▲ 3,5%" para un salto de 38,2% a 41,7% es otro número. */
const unidadDif = u => u === "%" ? "pp" : u;
function flecha(d, u){
  if (d === null || d === undefined || !isFinite(d)) return "";
  const uu = unidadDif(u);
  /* Con unidad "pp" `fmt` antepone el signo, y acá el signo ya lo lleva la
     flecha: una diferencia negativa salía como "▼ +5,5 pp", que se contradice
     sola. Para el resto de unidades `fmt` sigue mandando (redondea los conteos,
     pone el símbolo). */
  const txt = uu === "pp" ? nf(Math.abs(d), 1) + " pp" : fmt(Math.abs(d), uu);
  return `<span class="${d >= 0 ? "up" : "dn"}">${d > 0 ? "▲" : d < 0 ? "▼" : "="} ${txt}</span>`;
}
function tooltipHTML(p, esMz){
  const i = ind_actual;
  if (!i) return "";
  const e = ESC;
  /* En el nivel manzana el valor viaja con el NOMBRE del indicador (así es como
     el mapa lo pinta, con `["get", clave]`); en el municipal sigue siendo `v`,
     que es lo que escribe `pintar()` sobre el GeoJSON de los nueve. */
  const bruto = esMz ? p[i.k_mz] : p.v;
  const v = bruto === undefined || bruto === null ? null : +bruto;
  const hay = v !== null && isFinite(v);

  let nom, sub, filas = "", nota = "";

  if (esMz){
    /* Los datos ya no salen de un arreglo paralelo en memoria: vienen DENTRO
       de la tesela, con el nombre del indicador como atributo. `s` es el slug
       del municipio y `nom` la localidad tal como la escribe el INE. */
    const m = MUN.find(x => slugDe(x.nombre) === p.s);
    const loc = p.nom ? tituloCaso(p.nom) : "";
    nom = loc || "Manzana";
    // "Manzana en Porongo", no "Manzana · en Porongo": el municipio completa la
    // frase, no es otro dato de la lista.
    let cab = "Manzana";
    if (loc && m && loc.toLowerCase() !== m.nombre.toLowerCase()) cab += " en " + m.nombre;
    sub = cab;

    // Referencia natural de una manzana: el agregado URBANO de su municipio, no
    // la cifra municipal del INE, que incluye lo rural y no es comparable.
    const ref = m && m.urbano ? m.urbano[i.k_mz] : null;
    if (hay && ref !== null && ref !== undefined && isFinite(ref))
      filas += `<div class="pr"><span>urbano de ${m.nombre}</span><span><b>${fmt(ref, i.unit)}</b> ${flecha(v - ref, i.unit)}</span></div>`;
    const q = hay && e ? percentilRejilla(e.q, v) : null;
    if (q !== null)
      filas += `<div class="pr"><span>en la región</span><span>supera al <b>${nf(Math.round(q * 100), 0)}%</b> de las manzanas</span></div>`;
    if (!hay)
      nota = "Sin ficha. El INE no publica los datos de las manzanas más chicas, por privacidad.";
  } else {
    const m = MUN.find(x => x.sigep === p.sigep);
    if (!m) return "";
    nom = m.nombre;
    const pob = poblacionDe(m);
    sub = (m.ambito === "núcleo" ? "Núcleo metropolitano" : "Área de influencia")
        + (isFinite(pob) ? ` · ${nf(Math.round(pob), 0)} hab.` : "");

    if (hay && e){
      if (ANIO === "cambio"){
        /* Con un CAMBIO en pantalla, compararlo contra el pivote (que es cero)
           no dice nada: lo que hace falta son los dos censos que lo producen.
           Se muestran en la unidad del indicador, no en la del cambio. */
        const a = m.municipal_2012 ? m.municipal_2012[i.k_mun] : null;
        const b = m.municipal ? m.municipal[i.k_mun] : null;
        filas += `<div class="pr"><span>2012</span><span><b>${fmt(a, i.unit)}</b></span></div>`
              +  `<div class="pr"><span>2024</span><span><b>${fmt(b, i.unit)}</b></span></div>`;
        const r = refRegion(i);
        if (r && r.v !== null)
          filas += `<div class="pr"><span>${r.tipo}</span><span><b>${fmtM(r.v, i)}</b> ${flecha(v - r.v, uMode(i))}</span></div>`;
      } else {
        // el pivote se recorta para no degenerar la rampa: la diferencia se mide
        // contra el REAL, o el tooltip informa una brecha que no existe
        const pr = e.pivReal != null ? e.pivReal : e.piv;
        filas += `<div class="pr"><span>${e.tipo}</span><span><b>${fmtM(pr, i)}</b> ${flecha(v - pr, uMode(i))}</span></div>`;
      }
      const otros = MUN.map(x => valorMunicipal(x, i)).filter(z => z !== null && z !== undefined && isFinite(z));
      const puesto = otros.filter(z => z > v).length + 1;
      filas += `<div class="pr"><span>puesto</span><span><b>${puesto}.º</b> más alto de ${otros.length}</span></div>`;
    }
    if (!hay) nota = mudo(i) ? motivoSinSerie(i) : "Sin dato publicado para este indicador.";
  }

  const kicker = i.label
    + (i.fuente === "fiscal" && ANIO === "2024" ? ` · ${FIS.anios[anio_i]}` : "")
    + (ANIO === "2012" ? " · censo 2012" : ANIO === "cambio" ? " · cambio 2012→2024" : "");
  const rampa = hay && e
    ? `<div class="pramp" style="background:linear-gradient(to right,${e.tonos.join(",")})">
         <i style="left:${(posEnRampa(e, v) * 100).toFixed(1)}%"></i></div>`
    : "";
  return `<div class="pn">${nom}</div><div class="pd">${sub}</div>
    <div class="pind">${kicker}</div>
    <div class="pv"><span class="pchip" style="background:${tonoDe(e, v)}"></span>
      <b>${hay ? fmtM(v, i) : "s/d"}</b></div>
    ${rampa}${filas}${nota ? `<div class="pnota">${nota}</div>` : ""}`;
}
/* Sigue al cursor y se planta del otro lado cuando no entra: contra el borde
   derecho o el inferior, un tooltip anclado siempre abajo-a-la-derecha se sale
   de la pantalla justo en los municipios del borde, que son la mitad. */
function mostrarPop(html, x, y){
  if (!popEl) return;
  popEl.innerHTML = html;
  popEl.style.opacity = "1";
  const r = popEl.getBoundingClientRect();
  let L = x + 16, T = y + 16;
  if (L + r.width > innerWidth - 10) L = x - 16 - r.width;
  if (T + r.height > innerHeight - 10) T = y - 16 - r.height;
  popEl.style.left = Math.max(10, L) + "px";
  popEl.style.top = Math.max(10, T) + "px";
}
function ocultarPop(){ if (popEl) popEl.style.opacity = "0"; }

/* ── INTERACCIÓN ─────────────────────────────────────────────────────────── */
function interacciones(){
  map.on("click", "mun-fill", ev => { if (nivel === "municipio") seleccionar(ev.features[0].properties.sigep); });
  const mostrar = (ev, esMz) => {
    const html = tooltipHTML(ev.features[0].properties, esMz);
    if (!html) return ocultarPop();
    mostrarPop(html, ev.originalEvent.clientX, ev.originalEvent.clientY);
  };
  map.on("mousemove", "mun-fill", ev => { if (nivel === "municipio") mostrar(ev, false); });
  map.on("mouseleave", "mun-fill", ocultarPop);
  // la capa de manzanas sólo existe si este tablero tiene el nivel
  if (map.getLayer("mz-fill")){
    map.on("mousemove", "mz-fill", ev => { if (nivel === "manzana") mostrar(ev, true); });
    map.on("mouseleave", "mz-fill", ocultarPop);
  }
  // Arrastrar el mapa con el tooltip pegado al cursor lo deja flotando sobre un
  // polígono que ya no es el de abajo.
  map.on("dragstart", ocultarPop);
  map.on("zoomstart", ocultarPop);
  // Los municipios se pueden clicar; las manzanas no, y el cursor lo dice.
  map.on("mouseenter", "mun-fill", () => { if (nivel === "municipio") map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", "mun-fill", () => { map.getCanvas().style.cursor = ""; });
  map.getCanvas().style.cursor = "";
}
</script>
