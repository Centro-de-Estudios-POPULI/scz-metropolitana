<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Santa Cruz · Atlas Metropolitano — Municipal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500;1,6..72,600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<!-- La identidad se extrae del Atlas Socioeconómico, no se transcribe:
     `python scripts/extraer_estilo.py`. Ver la cabecera del archivo. -->
<link href="../estilo-atlas.css" rel="stylesheet">
<!-- ⚠️ DESPUÉS de estilo-atlas.css a propósito: esa hoja trae la estructura y
     los tokens del Observatorio, y ésta los reemplaza por los de la
     Gobernación. Si se invirtiera el orden, la identidad vieja ganaría. -->
<link href="../identidad-gobernacion.css" rel="stylesheet">
<style>
/* ── Sólo lo propio de este tablero. Todo lo demás vive en estilo-atlas.css ── */
#mapbox{position:fixed;inset:0}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{display:none}
.maplibregl-canvas{outline:none}

/* Selector de nivel: es el control que define este producto, así que va en la
   barra superior y no escondido en un panel. */
.niv{display:none}   /* el nivel lo decide el zoom: ver `nivelDeZoom()` */
/* Conmutador de CENSO: el mismo control visual que el de nivel —son dos ejes del
   mismo tablero y tienen que verse hermanos— pero con CLASE PROPIA, porque
   `generar_sitios.py` apaga la regla de arriba por reemplazo de texto para el
   tablero de un solo nivel, y con una clase compartida se llevaría puesto este.
   Se comparte el estilo del botón, no la regla de display.
   (Y por eso este comentario no cita el literal que busca el reemplazo: si lo
   citara, la derivación lo reescribiría y quedaría diciendo otra cosa.)
   Si el catálogo no trae serie censal, lo apaga el JS. */
.seg{display:flex;flex:none;border:1px solid rgba(255,255,255,.22);overflow:hidden}
.niv button,.seg button{font:600 .66rem/1 var(--f);letter-spacing:.02em;color:rgba(255,255,255,.72);
  background:transparent;border:0;padding:7px 11px;cursor:pointer;transition:background .18s,color .18s}
.niv button+button,.seg button+button{border-left:1px solid rgba(255,255,255,.22)}
.niv button:hover:not(:disabled),.seg button:hover:not(:disabled){background:rgba(255,255,255,.12);color:#fff}
.niv button.on,.seg button.on{background:var(--warm);color:#17221a}
.niv button:disabled,.seg button:disabled{opacity:.38;cursor:not-allowed}

/* Indicador que el censo de 2012 no puede dar: se APAGA y se explica en su propia
   tarjeta. No se oculta ni se saca del menú — que un indicador exista y no tenga
   serie es información, y esconderlo haría creer que el menú cambia de tamaño
   solo, sin decir por qué. */
.ind.sin12{opacity:.62}
.ind.sin12 .i-nm{color:var(--suave)}
.i-tag{display:inline-block;font-size:.54rem;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--suave);border:1px solid var(--linea);
  padding:0 5px;margin-bottom:4px}
.kpi.sin12{opacity:.6}
/* El motivo dentro de un KPI: es una nota, no una cifra, y va acotado a dos
   líneas — sin el recorte se salía de la tarjeta y cortaba la palabra a la mitad. */
.k-w{font-size:.55rem;line-height:1.25;color:var(--suave);display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Aviso de por qué el nivel manzana no está disponible, o de qué cambia al bajar */
.aviso{position:fixed;z-index:13;left:50%;transform:translateX(-50%);
  bottom:calc(var(--peek) + 18px);max-width:min(30rem,86vw);
  background:var(--glass);border:1px solid var(--linea);box-shadow:var(--sh);
  padding:9px 13px;font-size:.72rem;line-height:1.45;color:var(--tx);
  backdrop-filter:blur(7px);display:none;animation:softIn .22s ease}
.aviso.on{display:block}
.aviso b{color:var(--red)}
body.dark .aviso b{color:var(--orange)}

/* Selector de gestión, sólo visible con un indicador fiscal activo */
.anios{display:none;gap:0;border:1px solid var(--linea);overflow:hidden;margin:8px 0 2px}
.anios.on{display:flex;flex-wrap:wrap}
.anios button{font:600 .62rem/1 var(--f);color:var(--suave);background:var(--card-solid);
  border:0;padding:5px 7px;cursor:pointer}
.anios button+button{border-left:1px solid var(--linea-2)}
.anios button.on{background:var(--sel);color:#fff}

/* Barra de carga de las manzanas */
#carga{position:fixed;top:54px;left:0;right:0;height:2px;z-index:15;background:transparent}
#carga i{display:block;height:100%;width:0;background:var(--warm);transition:width .2s}

.cober{font-size:.63rem;color:var(--faint);line-height:1.5;margin-top:7px;
  padding-top:7px;border-top:1px solid var(--linea-2)}

/* ── Tooltip ────────────────────────────────────────────────────────────────
   El molde (#pop, .pn, .pd, .pv, .pr) viene del Atlas en `estilo-atlas.css`.
   Acá van sólo las piezas que este tablero agrega: el chip del color que le
   tocó en el mapa, la rampa con el marcador de dónde cae el valor, el rótulo
   del indicador y la nota de las manzanas sin ficha. */
#pop{max-width:16rem;transition:opacity .12s ease}
#pop .pind{font-size:.53rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
  color:var(--faint);margin-top:.45rem;line-height:1.3}
#pop .pv{margin-top:.16rem}
#pop .pchip{width:11px;height:11px;flex:none;align-self:center;
  box-shadow:0 0 0 1px rgba(128,140,148,.42)}
/* La rampa es la MISMA del termómetro y del mapa; el marcador dice en qué punto
   de ese degradé cayó este polígono, que es lo que el color ya está diciendo
   pero sin obligar a estimarlo a ojo contra la leyenda del pie. */
#pop .pramp{position:relative;height:5px;margin:.42rem 0 .1rem;border:1px solid var(--linea-2)}
#pop .pramp i{position:absolute;top:-2.5px;bottom:-2.5px;width:2px;margin-left:-1px;
  background:var(--tx);box-shadow:0 0 0 1px var(--card-solid)}
#pop .pr{gap:.7rem;align-items:baseline}
#pop .pr>span:first-child{flex:none;color:var(--faint)}
#pop .pr>span:last-child{text-align:right;min-width:0}
#pop .pr .up{color:var(--teal-dk);font-weight:700;margin-left:.15rem}
#pop .pr .dn{color:var(--orange);font-weight:700;margin-left:.15rem}
#pop .pnota{font-size:.54rem;color:var(--faint);line-height:1.5;margin-top:.34rem;
  padding-top:.34rem;border-top:1px solid var(--linea-2)}
#pop .pnota b{color:var(--suave);font-weight:600;font-variant-numeric:tabular-nums}

/* El Atlas trae `#panel-det{display:none}` porque allá la ficha aparece recién
   al elegir un municipio. Acá el panel derecho sirve siempre: muestra la
   comparación de los nueve, que es la lectura por defecto de una región. */
#panel-det{display:flex!important;flex-direction:column}
#panel-det .p-body{overflow-y:auto;padding:12px 14px}

/* Grupos por nivel dentro de una categoría */
.nivsep{font-size:.56rem;font-weight:700;text-transform:uppercase;letter-spacing:.11em;
  color:var(--faint);margin:14px 0 6px;display:flex;align-items:center;gap:7px}
.nivsep::after{content:"";flex:1;height:1px;background:var(--linea-2)}
.nivsep:first-child{margin-top:2px}

/* Comparativo entre municipios (panel derecho) */
/* ESCALA. Ojo con las medidas de acá: son unidades de viewBox, no píxeles. El
   SVG se estira al ancho del panel (~220–300 px para 100 unidades), así que
   cada unidad vale 2,2–3,0 px reales. Con 5,4 los nombres salían a 12–16 px,
   el doble que las etiquetas del panel de indicadores (.k-l 7,4 px · .i-df
   9 px) y el panel derecho se leía de otro tamaño que el resto del tablero. */
.cmp-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:.55rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);margin:2px 0 6px}
.cmp-t span{font-family:var(--f);text-transform:none;letter-spacing:0;
  font-size:.62rem;font-weight:600;color:var(--suave)}
.cmp{width:100%;height:auto;display:block;overflow:hidden}
.cmp .cmp-n{font:500 4px var(--f);fill:var(--suave)}
.cmp .cmp-n.sel{fill:var(--sel);font-weight:700}
.cmp .cmp-v{font:700 3.9px var(--f);fill:var(--tx);font-variant-numeric:tabular-nums}
.cmp .cmp-piv{stroke:var(--tx);stroke-width:.5;stroke-dasharray:1.6 1.4;opacity:.55}
/* ── Distribución dentro del municipio ───────────────────────────────────────
   Mismas unidades de viewBox que el comparativo (1 unidad = 2,2-3,0 px reales),
   así las dos lecturas se apilan sin cambiar de tamaño de letra. El bigote es
   deliberadamente tenue: lo que se lee primero es la caja —la mitad más
   común— y la línea de la mediana. */
.cmp .ds-w{stroke:var(--faint);stroke-width:.45;opacity:.75}
.cmp .ds-med{stroke:var(--tx);stroke-width:.75}
.cmp .ds-g{font:600 3.6px var(--f);fill:var(--suave);font-variant-numeric:tabular-nums}
.cmp .ds-u{font-weight:500;fill:var(--faint)}
.cmp .ds-ax{font:500 3.2px var(--f);fill:var(--faint)}
.cmp .ds-hit{fill:transparent;cursor:pointer}
.cmp .ds-hit:hover{fill:var(--tx);fill-opacity:.045}
.ds-ley{display:flex;flex-wrap:wrap;align-items:center;gap:4px 9px;
  font-size:.56rem;color:var(--faint);margin:5px 0 2px;line-height:1.4}
.ds-ley span{display:inline-block;margin-right:2px}
.ds-k1{width:13px;height:0;border-top:1.5px solid var(--faint);opacity:.8;
  transform:translateY(-2px)}
.ds-k2{width:11px;height:7px;border-radius:1.5px;background:var(--faint);opacity:.55;
  transform:translateY(1px)}
.ds-k3{width:0;height:9px;border-left:1.5px solid var(--tx);transform:translateY(2px)}
.sin{font-size:.7rem;color:var(--faint);padding:6px 0}

/* ── Serie fiscal: 10 gestiones del municipio contra la región ───────────────
   DOS COLORES, elegidos con el validador de la paleta y no a ojo. El par
   obvio —`--sel` contra `--faint`— FALLA en oscuro: ΔE 12,2 en visión normal,
   por debajo del piso de 15, o sea dos líneas que cuesta distinguir aun viendo
   todos los colores. Los tonos de acá pasan separación normal (19,9 y 16,5),
   CVD y contraste ≥3:1 contra la superficie en los dos temas.
   El gris de la región queda FUERA del piso de croma a propósito: no es una
   segunda entidad compitiendo por identidad, es la referencia contra la que se
   lee el municipio, y tiene que leerse como cromo. */
:root{--ser-mun:#005f73;--ser-reg:#7d8f99}
body.dark{--ser-mun:#43b3bd;--ser-reg:#c3d0d6}
#serie:not(:empty){margin:15px 0 2px}
.ser{width:100%;height:auto;display:block;overflow:visible}
.ser-l{fill:none;stroke-width:.72;stroke-linejoin:round;stroke-linecap:round}
.ser-l.mun{stroke:var(--ser-mun)}
/* Trazo discontinuo en la región: la identidad no queda librada SÓLO al color. */
.ser-l.reg{stroke:var(--ser-reg);stroke-dasharray:2.4 1.8}
.ser-d{fill:var(--ser-mun)}
/* Anillo del color de la superficie, no un borde: separa el punto activo de la
   línea que pasa por debajo sin dibujar un contorno. */
.ser-d.on{stroke:var(--card-solid);stroke-width:.75}
/* Misma escala de viewBox que el comparativo de acá arriba (~4 unidades), para
   que los dos gráficos del panel se lean del mismo tamaño. */
.ser-ax{font:500 3.8px var(--f);fill:var(--faint)}
.ser-ax.on{fill:var(--tx);font-weight:700}
.ser-tk{font:500 3.6px var(--f);fill:var(--faint);font-variant-numeric:tabular-nums}
/* Halo del color del panel: la cifra de la gestión activa se dibuja pegada a su
   punto y ahí pasa la línea, así que sin esto queda tachada por el trazo. Con
   `paint-order` el contorno va DEBAJO del relleno y no engorda la letra. */
.ser-v{font:700 4.2px var(--f);fill:var(--tx);font-variant-numeric:tabular-nums;
  paint-order:stroke;stroke:var(--card-solid);stroke-width:.9px;stroke-linejoin:round}
.ser-base{stroke:var(--linea-2);stroke-width:.4}
/* La banda ocupa TODO el alto del área de dibujo: el blanco de arriba y de
   abajo también selecciona el año, así que no hay que acertarle al punto. */
.ser-band rect{fill:transparent;cursor:pointer}
.ser-gd{stroke:var(--ser-mun);stroke-width:.4;opacity:0;transition:opacity .12s}
.ser-band:hover .ser-gd{opacity:.45}
.ser-lg{display:flex;flex-wrap:wrap;gap:11px;margin-top:6px;
  font-size:.55rem;color:var(--suave);font-weight:500}
.ser-lg span{display:flex;align-items:center;gap:5px;min-width:0}
.ser-lg b{color:var(--tx);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ser-lg i{width:13px;height:2px;flex:none;background:var(--ser-mun)}
.ser-lg i.reg{background:repeating-linear-gradient(90deg,var(--ser-reg) 0 3.5px,transparent 3.5px 5.5px)}

/* Nada del panel derecho puede empujar hacia afuera: los valores largos
   (1.610.982) y los nombres de municipio desbordaban la columna. */
#panel-det,#panel-det *{min-width:0}
#panel-det .kgrid{width:100%}
/* La cifra de cada tarjeta bajó de .78–1rem a .72–.88rem: a 1rem competía con el
   título del panel y hacía que la ficha se leyera a otra escala que la lista de
   indicadores de la izquierda. */
#panel-det .k-v{overflow-wrap:anywhere;font-size:clamp(.72rem,1.8vw,.88rem)}
#panel-det .k-l,#panel-det .k-c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#panel-det .k-c{display:flex;justify-content:space-between;gap:6px}
#panel-det .k-c span{overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

<div id="mapbox"><div id="map"></div></div>
<div id="carga"><i></i></div>

<div id="top">
  <!-- La barra superior es oscura en los DOS temas, así que va siempre el
       logo de texto claro. El de texto oscuro queda para fondo claro (pie,
       impresos, portadas). -->
  <a class="marca" href="https://www.santacruz.gob.bo" target="_blank" rel="noopener"
     aria-label="Gobierno Autónomo Departamental de Santa Cruz">
    <img src="../img/scz-oscuro.png" alt="Gobierno Autónomo Departamental de Santa Cruz">
  </a>
  <div class="t-tit">

    <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<div class="panel" id="panel-ind">
  <div class="cat-bar" id="cat-bar">
    <div class="p-kick"><span>Categoría</span><span class="kick-n" id="kick-n"></span></div>
    <button class="cat-btn" id="cat-btn"><span class="cn">Demografía</span><span class="ar">▾</span></button>

    <!-- Este tablero es un producto de la Gobernación y se presenta como tal:

    <a class="marca-pie" href="https://www.santacruz.gob.bo" target="_blank" rel="noopener">
      <img src="../img/scz-claro.png" alt="Gobierno Autónomo Departamental de Santa Cruz">

<div class="termo">
  <div class="tm-top"><div class="tm-t" id="tm-t">—</div><div class="tm-st" id="tm-st"></div></div>
  <div class="tm-row"><span class="tm-side" id="tm-lo"></span><div class="tm-bar" id="tm-bar"></div><span class="tm-side" id="tm-hi"></span></div>
</div>

<div class="aviso" id="aviso"></div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   ATLAS METROPOLITANO DE SANTA CRUZ
   Dos niveles en un mapa: 9 municipios y 38.892 manzanas.

   La escala es la MISMA que la de los atlas nacionales (divergente con ancla
   real y rampa orientada por `dir`), portada de `ps.escala_atlas` / del JS de
   Mapa_Censo_2024_Bolivia.html. Que un municipio se lea igual acá que en el
   atlas nacional no es un detalle: es la razón de que el ecosistema sirva.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── RAMPA DIVERGENTE DE LA GOBERNACIÓN ──────────────────────────────────
   Verde ← neutro → naranja, con el pivote de la región clavado en el centro
   (`posEnRampa` lo fija en 0,5). O sea que el tono no dice sólo "cuánto":
   dice de qué lado de la región cae este municipio o esta manzana.

   ★ UNA SOLA PALETA. En oscuro NO se cambia de rampa: se usan LOS MISMOS
   colores, más brillantes (pedido de Carlos, 2026-08-19). Antes había dos
   rampas distintas y al alternar el tema el mapa cambiaba de identidad, no
   sólo de fondo — un municipio pasaba de verde profundo a verde lima y
   parecía otro dato.

   El realce es PROPORCIONAL a lo que le falta a cada tono para llegar al
   blanco (`l + (1-l)·k`), no una suma fija: así los oscuros —que sobre fondo
   oscuro se cierran y dejan de distinguirse entre sí— suben mucho, y los que
   ya eran claros casi no se mueven. El tono no se toca, que es lo que hace
   que se reconozca la misma paleta. */
const DIV_CLARA = ["#00733b","#419a3a","#8bc53f","#eeebe1","#dea015","#d8690c","#a8381e"];
const REALCE = .26;          // cuánto se acerca cada tono al blanco en oscuro

function hexHSL(h){
  h = h.replace("#", "");
  const r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255,
        b = parseInt(h.slice(4,6),16)/255;
  const mx = Math.max(r,g,b), mn = Math.min(r,g,b), l = (mx+mn)/2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > .5 ? d/(2-mx-mn) : d/(mx+mn);
  const hh = mx === r ? ((g-b)/d + (g < b ? 6 : 0))
           : mx === g ? ((b-r)/d + 2) : ((r-g)/d + 4);
  return [hh/6, s, l];
}
function hslHex(hh, s, l){
  const f = n => {
    const k = (n + hh*12) % 12, a = s*Math.min(l, 1-l);
    const v = l - a*Math.max(-1, Math.min(k-3, 9-k, 1));
    return Math.round(255*v).toString(16).padStart(2,"0");
  };
  return "#" + f(0) + f(8) + f(4);
}
/* Un tono más brillante, sin cambiar de tono. La saturación sube apenas para
   que el aclarado no lo lave. */
const brillar = c => {
  const [h, s, l] = hexHSL(c);
  return hslHex(h, Math.min(1, s*1.06), l + (1 - l)*REALCE);
};
const DIV_OSCURO = DIV_CLARA.map(brillar);   // se calcula una vez, no por pintado

/* `dir === 1` significa que más es PEOR, así que la rampa se da vuelta y el
   verde queda del lado bueno en los dos casos. */
const rampa = dir => {
  const r = esOscuro() ? DIV_OSCURO : DIV_CLARA;
  return dir === 1 ? r.slice().reverse() : r.slice();
};

const UMBRAL_ZOOM = 11.4;     // a partir de acá el nivel manzana tiene sentido visual

/* Un gris único para los dos temas, declarado por la Gobernación. Lo que tiene
   que hacer el "sin dato" es no parecerse a ningún tono de la rampa, y éste no
   se parece en ninguno de los dos fondos. Acá es sobre todo el gris de las
   13.194 manzanas que el INE suprime por privacidad, que se dibujan a
   propósito: borrarlas dejaría agujeros que se leen como "no vive nadie". */
const SIN_DATO = {claro:"#8a8f96", oscuro:"#8a8f96"};

/* OPACIDADES. Bajas a propósito: el coroplético va ENCIMA de un mapa real, y si
   lo tapa deja de servir de referencia justo cuando más se la necesita —al
   acercarse a la manzana—. Con el relleno translúcido se leen las dos cosas: el
   valor por el tono y el lugar por la calle de abajo.
   ★ MÁS BAJAS EN OSCURO: la rampa tiene #8bc53f —un verde muy luminoso— en un
   extremo, y cuando la mayoría de los valores cae de ese lado (pasa con
   `pct_agua_pozo`, mediana 0,0%) el mapa entero se vuelve un bloque de verde
   neón sobre el fondo oscuro y deja de leerse la ciudad debajo. */
const OPACIDAD_CLARO  = {mun: .55, mz: .62};
const OPACIDAD_OSCURO = {mun: .42, mz: .46};
const opacidades = () => esOscuro() ? OPACIDAD_OSCURO : OPACIDAD_CLARO;

const SENAL = "#8bc53f";

/* FUNDIDO POR ZOOM. En vez de que el nivel cambie de golpe con el botón, las dos
   capas conviven y se cruzan en una banda de zoom: al acercarte, los municipios
   se desvanecen mientras las manzanas aparecen. El botón sólo te lleva de un
   lado al otro de esa banda. */
/* ── LA BANDA DEL CRUCE ───────────────────────────────────────────────────
   El zoom es lo ÚNICO que cambia de nivel: no hay botón. Se sacó porque no
   tenía nada que decidir — los 59 indicadores del tablero de manzana existen
   en los dos niveles (medido: 59 de 59 con `k_mun` Y `k_mz`), así que cruzar
   nunca obliga a cambiar de indicador.

   Z0 → el relleno de manzana empieza a aparecer
   ZC → el punto donde cambia el nivel LÓGICO (leyenda, panel, tooltip)
   Z1 → el relleno municipal terminó de irse

   ★ Arranca en 12,2 y no en 10,6 como antes, y es una decisión de lectura: a
     z11 una sola tesela se lleva 8.707 manzanas de un píxel. Eso es la mancha
     que este proyecto decidió no mostrar, y encima es el nivel más pesado.
     Las teselas empiezan en z12 (`generar_pmtiles.py`), justo antes de Z0. */
const Z0 = 10.0, ZC = 10.4, Z1 = 10.9;
/* ★ LA BANDA ES ANGOSTA (0,7) A PROPÓSITO. La primera versión cruzaba en 1,2 y
   dejaba una zona muerta alrededor de z12,5: el relleno municipal ya estaba
   lavado y el de manzana todavía no pesaba, así que durante medio nivel de
   zoom no se leía bien ninguno de los dos. Fotografiado en los cuatro pasos
   antes de angostarla. Es casi el mismo ancho que usa desarrollo-infantil
   (±0,3 alrededor de su umbral de detalle), y por la misma razón.

   ★ DÓNDE ARRANCA SE ELIGE POR LO QUE ENTRA EN PANTALLA. A la latitud de
   Santa Cruz, con 1280 px de ancho:
       z11,4 → 70,6 km de ancho · manzana de 100 m = 1,8 px
       z11,7 → 57,6 km          · 2,2 px
       z12,1 → 43,5 km          · 2,9 px
       z12,7 → 28,7 km          · 4,5 px
       z13,0 → 23,3 km          · 5,5 px
   La mancha urbana mide ~25 km y la conurbación entera (capital + Warnes +
   Cotoca + La Guardia + Porongo + El Torno) unos 55. Cruzando en 12,7 —como
   estaba al principio— la ciudad recién entraba justa, y EN MÓVIL (390 px) se
   veían 8,7 km: un tercio. Se bajó en dos pasos hasta acá, para que al cambiar
   de nivel se vea la CONURBACIÓN y no una porción de la capital.
   ⚠️ **10,0 ES EL PISO Y YA ESTAMOS EN ÉL**: `generar_pmtiles.py` arranca en
   z10 y MapLibre pide `floor(zoom)`, así que por debajo no hay tesela que
   pedir. Y a z10 una manzana de 100 m mide **0,7 px**: es sub-píxel, o sea que
   ya no se lee como polígono sino como MANCHA. Eso es deliberado —es lo que
   se pidió— pero marca el fondo: por debajo no habría nada que mirar.
   ⚠️ Y a z11,4 la manzana mide 1,8 px: ahí las manzanas RECIÉN ASOMAN, con la
   opacidad casi en cero. Llegan a opacidad plena en 12,1, con 2,9 px. Que el
   nivel exista no significa que se deba mirar fijo la región entera cubierta
   de manzanas — eso lo evita el fundido, no el teselado. */
const fundido = (a, b) => ["interpolate", ["linear"], ["zoom"], Z0, a, Z1, b];

/* ★ EL RELLENO MUNICIPAL SE VA MÁS RÁPIDO QUE LINEAL (pedido de Carlos).
   Con una recta, a mitad de la banda el municipio todavía conserva la mitad de
   su tinta y le compite el color a las manzanas que están apareciendo justo
   ahí: se ven las dos capas mezcladas y no se lee bien ninguna. Con la caída
   adelantada, al 30% del cruce ya está en el 28% de su opacidad, así que el
   nivel de abajo queda con el color para él solo casi enseguida.
   El BORDE municipal no cambia: ese es el que sostiene la referencia de en qué
   municipio estás, y se va mucho más arriba. */
const fundidoMun = a => ["interpolate", ["linear"], ["zoom"],
  Z0, a,
  Z0 + (Z1 - Z0) * .3, a * .28,
  Z1, 0];

/* Y las manzanas suben un poco ANTES de lo lineal, para que el hueco que deja
   el municipal no quede lavado: al 40% del cruce ya están al 70% de su tinta.
   Es el mismo problema que hizo angostar la banda la primera vez —una zona
   donde no se lee bien ninguna de las dos capas—, resuelto ahora por la forma
   de las curvas en vez de por el ancho. */
const fundidoMz = b => ["interpolate", ["linear"], ["zoom"],
  Z0, 0,
  Z0 + (Z1 - Z0) * .4, b * .7,
  Z1, b];

let CAT, MUN, FIS, cat_actual, ind_actual, nivel = "municipio", anio_i = 9;
/* ── EL CENSO EN PANTALLA ─────────────────────────────────────────────────────
   Tres estados: el censo de 2024, el de 2012, y el CAMBIO entre los dos.

   ★ Los datos de 2012 ya viajaban dentro de `municipios_municipal.json` —en el
     bloque `municipal_2012` de cada municipio— y la interfaz no los miraba. Son
     9 municipios: el archivo entero pesa 96 KB, así que acá NO hace falta la
     carga diferida que sí necesita el Atlas nacional (343 municipios, 1,6 MB).
     Ese es todo lo que se simplifica al portar; el resto de la lógica es la misma.

   ★ Y LA PRESENCIA SE MIDE DEL DATO, NO SE DECLARA. El catálogo traía un campo
     `serie` que decía `true` en 238 de 240 indicadores cuando sólo 176 tienen
     cifra de 2012: medía que la COLUMNA existiera, y los motores la emiten igual
     —vacía— cuando 2012 no puede dar el indicador. Con un conmutador en pantalla
     eso no es un flag inexacto, es prometer un mapa que sale gris entero. Ahora
     `armar_tableros.py` cuenta los municipios con valor y emite `s12`; lo único
     declarado es `w12`, la EXPLICACIÓN de la ausencia. */
let ANIO = "2024";                      // "2024" | "2012" | "cambio"

/* ★ QUÉ ES UN CONTEO LO DECLARA EL CATÁLOGO (`agg:"suma"`), no su unidad. Se
   necesita en dos lugares: el pivote (el promedio ponderado de un conteo da
   Σp²/Σp, el tamaño del municipio de la persona promedio: no es legible, así que
   un conteo se centra en su mediana) y la unidad del cambio. Deducirlo de la
   unidad es el error que publicó "Personas por hogar: 1.049,2" y
   "Viviendas: país 62.550" en el Atlas nacional. */
const esConteo = i => i.agg === "suma";
/* Un porcentaje cambia en PUNTOS PORCENTUALES y un conteo en PORCENTAJE. */
const uMode = i => ANIO !== "cambio" ? i.unit
                 : (esConteo(i) ? "%" : (i.unit === "%" ? "pp" : i.unit));
/* Sin serie no se puede mirar fuera de 2024: el indicador queda MUDO, y el
   motivo (`w12`) se escribe en la tarjeta, en la leyenda y en el KPI. */
const mudo = i => ANIO !== "2024" && !i.s12;
const haySerie = () => !!(CAT && CAT.grupos.some(g => g.indicadores.some(i => i.s12)));
function difIntercensal(a, b, ind){
  if (a === null || a === undefined || b === null || b === undefined
      || !isFinite(a) || !isFinite(b)) return null;
  return esConteo(ind) ? (a ? 100 * (b - a) / a : null) : b - a;
}
let MZS = null, sel = null;   // MZS = estadísticas precalculadas del nivel manzana
// Escala vigente (la que acaba de pintar el mapa). El tooltip la lee para dar el
// chip de color, la posición en la rampa y el percentil sin recalcular nada.
let ESC = null;
// `map` se declara ACÁ ARRIBA y no junto a su creación: la inicialización del
// tema corre antes y lo consulta, y con `let` eso no devuelve undefined sino que
// tira ReferenceError por la zona muerta temporal — mataba el script entero
// antes de montar el panel.
let map = null, sinMapa = false, MINI = null;
const esOscuro = () => document.body.classList.contains("dark");

/* ── TEMA ────────────────────────────────────────────────────────────────── */
function aplicarTema(oscuro, guardar){
  document.body.classList.toggle("dark", oscuro);
  const b = document.getElementById("theme-btn");
  if (b) b.title = oscuro ? "Modo claro" : "Modo oscuro";
  if (guardar) { try { localStorage.setItem("scz-tema", oscuro ? "dark" : "light"); } catch(_){} }
  if (map && map.getLayer && map.getLayer("base_claro")){
    map.setLayoutProperty("base_claro", "visibility", oscuro ? "none" : "visible");
    map.setLayoutProperty("base_oscuro", "visibility", oscuro ? "visible" : "none");
    map.setPaintProperty("fondo", "background-color", oscuro ? "#12181c" : "#eeebe1");
    const borde = oscuro ? "#12181c" : "#ffffff";
    if (map.getLayer("mun-line")) map.setPaintProperty("mun-line", "line-color", borde);
    if (map.getLayer("mz-line")) map.setPaintProperty("mz-line", "line-color", borde);
    /* Las opacidades cambian con el tema (ver OPACIDAD_*), así que hay que
       volver a declararlas acá: se fijan al montar la capa y no se enteran
       solas de que el fondo cambió. */
    if (map.getLayer("mun-fill"))
      map.setPaintProperty("mun-fill", "fill-opacity",
        hayManzana() ? fundidoMun(opacidades().mun) : opacidades().mun);
    if (map.getLayer("mz-fill"))
      map.setPaintProperty("mz-fill", "fill-opacity", fundidoMz(opacidades().mz));
  }
  if (map) pintar();
  if (typeof CAT !== "undefined" && CAT && cat_actual) montarIndicadores();
}
(() => { let p = null; try { p = localStorage.getItem("scz-tema"); } catch(_){}
  aplicarTema(p ? p === "dark" : matchMedia("(prefers-color-scheme:dark)").matches, false); })();
document.getElementById("theme-btn").onclick = () => aplicarTema(!esOscuro(), true);

/* ── ESCALA ──────────────────────────────────────────────────────────────────
   Idéntica a la de los atlas: dominio [bajo, pivote, alto] con el pivote en el
   AGREGADO REGIONAL —una magnitud real, la de la región, ponderada por el
   universo de cada indicador— y la rampa invertida cuando `dir:+1`, para que el
   rojo marque siempre el lado malo. El recorte p02/p98 evita que un outlier se
   coma media paleta. */
function cuantil(ord, q){
  if (!ord.length) return null;
  const h = (ord.length - 1) * q, b = Math.floor(h), r = h - b;
  return ord[b + 1] !== undefined ? ord[b] + r * (ord[b + 1] - ord[b]) : ord[b];
}
/* ★ EL PIVOTE DECLARADO. `armar_tableros.py` calcula el agregado de los 9
   ponderando por EL UNIVERSO DE CADA INDICADOR —un porcentaje de viviendas por
   viviendas, no por personas— y lo embarca en `CAT.region`. La interfaz lo
   ignoraba y lo recalculaba acá ponderando todo por población: la mediana de la
   discrepancia era 0,03, pero `emigrantes_x1000` salía 26,4‰ en vez de 28,5‰
   (8% de error) y varios porcentajes se corrían medio punto. El número correcto
   ya viajaba en el archivo; sólo había que leerlo. */
function pivDeclarado(ind, ambito){
  if (!CAT || !CAT.region) return null;
  if (ANIO === "cambio") return 0;
  let caja = null;
  if (ambito === "urbano") caja = ANIO === "2024" ? CAT.region.urbano : null;
  else if (ambito === "municipio")
    caja = ANIO === "2012" ? CAT.region.municipal_2012 : CAT.region.municipal;
  const v = caja ? caja[ind.k_mun || ind.k_mz] : null;
  return v === null || v === undefined || !isFinite(v) ? null : v;
}
/* `ambito` dice DE DÓNDE salen los valores, y con eso qué se puede declarar:
     "municipio" → los 9 del censo: dominio Y pivote declarados
     "urbano"    → el agregado urbano de los 9: pivote declarado, dominio propio
     "manzana"   → 25.698 manzanas: nada declarado, el rango es otro por completo
   Aplicarle el dominio municipal a las manzanas achataría el mapa entero: son
   bloques, no promedios, y su rango es mucho más ancho. */
function escala(valores, pesos, ind, ambito){
  if (esConteo(ind)) pesos = null;
  const v = [], w = [];
  for (let i = 0; i < valores.length; i++){
    const x = valores[i];
    if (x === null || x === undefined || !isFinite(x)) continue;
    v.push(x); w.push(pesos && isFinite(pesos[i]) ? pesos[i] : 0);
  }
  if (!v.length) return null;
  const ord = v.slice().sort((a,b) => a - b);
  const decl = ambito === "municipio";
  let lo, hi, piv, tipo;
  if (ANIO === "cambio" || ind.div){
    /* SIMÉTRICO ALREDEDOR DE CERO: si el dominio no lo fuera, un avance de +2 y
       un retroceso de −2 se pintarían con intensidades distintas y el mapa
       mentiría sobre la magnitud del cambio. */
    const m = (decl && ANIO === "cambio" && ind.domd != null) ? ind.domd
            : (Math.max(Math.abs(cuantil(ord, .02)), Math.abs(cuantil(ord, .98))) || 1);
    lo = -m; hi = m; piv = 0; tipo = ANIO === "cambio" ? "sin cambio" : "cero";
    const tonosC = rampa(ind.dir);
    return {lo, piv, hi, pivReal: 0, tipo, tonos: tonosC, ord,
            min: ord[0], max: ord[ord.length-1],
            recorte: ord[0] < lo || ord[ord.length-1] > hi, n: v.length};
  }
  /* ★ UNA SOLA ESCALA PARA LOS DOS CENSOS: el rango llega DECLARADO en `ind.dom`,
     calculado sobre la UNIÓN de 2012 y 2024. Así un mismo tono significa un mismo
     valor en los dos mapas y, al alternar de año, el corrimiento de color ES el
     avance de la región.
     MEDIDO antes de adoptarlo, porque acá son 9 municipios y no 343 y no se podía
     suponer: el mapa de 2024 pasa a usar 0,862 de la rampa en la mediana (de
     1,000), sólo 2 de 176 indicadores bajan de la mitad y ninguno de un tercio.
     ⚠️ Los dos que más pierden son `pct_agua_sin_caneria` (0,46) y
     `pct_trab_familiar` (0,49): ahí el avance intercensal fue tan grande que el
     mapa de 2024 se concentra en un extremo. Es la lectura honesta.
     OJO a la asimetría deliberada: el rango DIBUJADO es el de los dos censos
     juntos, pero el mínimo y el máximo que informa la leyenda son los del censo
     EN PANTALLA — es lo que el lector está mirando. */
  if (decl && ind.dom){ lo = ind.dom[0]; hi = ind.dom[1]; }
  else { lo = cuantil(ord, .02); hi = cuantil(ord, .98); }
  if (hi <= lo){ lo = ord[0]; hi = ord[ord.length-1] || lo + 1; if (hi <= lo) hi = lo + 1; }
  /* ⚠️ EL PIVOTE DECLARADO NO VALE PARA UN CONTEO. El agregado que emite
     `armar_tableros.py` es un promedio ponderado, y ponderar un conteo por su
     propio universo da Σp²/Σp: el tamaño del municipio de la persona promedio.
     Y la magnitud regional de un conteo —la SUMA— cae por construcción fuera del
     rango municipal, así que centrar la rampa ahí la degeneraría. Un conteo se
     centra en su MEDIANA, que sí es una magnitud municipal. Es la misma guarda
     que le faltaba al Atlas nacional cuando publicó "país 62.550 viviendas". */
  piv = esConteo(ind) ? null : pivDeclarado(ind, ambito);
  if (piv === null){
    const sw = w.reduce((a,b) => a + b, 0);
    if (sw > 0){ piv = v.reduce((a,x,i) => a + x * w[i], 0) / sw; tipo = "región"; }
    else { piv = cuantil(ord, .5); tipo = "mediana"; }
  } else tipo = "región";
  /* El pivote tiene que caer DENTRO del rango dibujado: pegado a un extremo la
     rampa se degenera y media paleta no se usa nunca.
     ⚠️ Cuando eso pasa el número recortado YA NO ES la región ni la mediana, así
     que se guarda el real (`pivReal`) y la leyenda nombra el recorte en vez de
     rebautizar un borde con el nombre de una estadística. */
  const pivReal = piv, pad = (hi - lo) * .08;
  if (pad > 0) piv = Math.min(Math.max(piv, lo + pad), hi - pad);
  const tonos = rampa(ind.dir);
  // `ord` viaja de vuelta —ya está calculado— porque el tooltip necesita saber a
  // qué percentil corresponde un valor, y reordenar 25.698 manzanas en cada
  // movimiento del mouse sería absurdo.
  return {lo, piv, hi, pivReal, tipo, tonos, ord,
          min: ord[0], max: ord[ord.length-1],
          recorte: ord[0] < lo || ord[ord.length-1] > hi, n: v.length};
}
/* ★ LA ESCALA DEL NIVEL MANZANA, PRECALCULADA.
   `escala()` necesita todos los valores para sacar cuantiles, y en el nivel
   manzana ya no los hay en el cliente. Lo que hace `estadisticas_manzana.py`
   es exactamente la misma cuenta, movida a tiempo de armado: mismo `cuantil()`,
   mismo dominio 2%-98%, mismo pivote ponderado por personas.
   Devuelve la misma forma de objeto que `escala()` para que la leyenda, el
   termómetro y el tooltip no tengan que saber de dónde salió. */
function escalaManzana(ind){
  const st = MZS && MZS[ind.k_mz];
  if (!st || !st.esc) return null;
  const e = st.esc;
  let lo = e.lo, hi = e.hi;
  if (hi <= lo){ lo = e.min; hi = e.max > lo ? e.max : lo + 1; }
  const pivReal = e.piv, pad = (hi - lo) * .08;
  const piv = pad > 0 ? Math.min(Math.max(pivReal, lo + pad), hi - pad) : pivReal;
  return {lo, piv, hi, pivReal, tipo: e.tipo,
          tonos: rampa(ind.dir),
          q: e.q, ord: null, min: e.min, max: e.max,
          recorte: e.min < lo || e.max > hi, n: e.n};
}

/* Posición 0-1 de un valor sobre la rampa, con el pivote clavado en el 0,5:
   es la misma curva que arma `expresionColor` para el mapa, así que el chip del
   tooltip, la miniatura, la barra del comparativo y el polígono no pueden
   discrepar de color. Estaba copiada tres veces con nombres distintos. */
function posEnRampa(e, v){
  const t = v <= e.piv ? (e.piv === e.lo ? .5 : .5 * (v - e.lo) / (e.piv - e.lo))
                       : .5 + .5 * (v - e.piv) / (e.hi - e.piv);
  return Math.max(0, Math.min(1, t));
}
function tonoDe(e, v){
  if (!e || v === null || v === undefined || !isFinite(v))
    return SIN_DATO[esOscuro() ? "oscuro" : "claro"];
  return e.tonos[Math.round(posEnRampa(e, v) * (e.tonos.length - 1))];
}
/* Proporción de la muestra que queda ESTRICTAMENTE por debajo de `v`. Búsqueda
   binaria sobre el `ord` que ya trae la escala. */
function percentil(ord, v){
  if (!ord || !ord.length || v === null || !isFinite(v)) return null;
  let lo = 0, hi = ord.length;
  while (lo < hi){ const md = (lo + hi) >> 1; if (ord[md] < v) lo = md + 1; else hi = md; }
  return lo / ord.length;
}
/* ★ EL PERCENTIL DE UNA MANZANA, SIN TENER LAS 25.698 AL LADO.
   Antes `percentil()` buscaba el valor dentro del arreglo ordenado completo,
   que estaba en memoria porque se bajaban todos los datos. Con teselas el
   navegador sólo ve las de la pantalla, así que la distribución llega
   precalculada como una rejilla de 51 cuantiles (`mz_stats.json`) y el
   percentil se interpola entre los dos cortes que rodean al valor.
   Verificado contra el cálculo exacto: el error máximo es de 1 punto. */
function percentilRejilla(q, v){
  if (!q || !q.length || v === null || !isFinite(v)) return null;
  if (v <= q[0]) return 0;
  if (v >= q[q.length - 1]) return 1;
  let lo = 0, hi = q.length - 1;
  while (lo < hi){ const md = (lo + hi) >> 1; if (q[md] < v) lo = md + 1; else hi = md; }
  if (lo === 0) return 0;
  const a = q[lo - 1], b = q[lo], paso = 1 / (q.length - 1);
  const f = b > a ? (v - a) / (b - a) : 0;
  return (lo - 1 + f) * paso;
}
/* Expresión de color para MapLibre: se construye el degradé con paradas
   equiespaciadas a cada lado del pivote, que es como se comporta un
   scaleDiverging (el pivote cae en el 0,5 de la rampa, no en el medio numérico). */
function expresionColor(e, campo){
  if (!e) return SIN_DATO[esOscuro() ? "oscuro" : "claro"];
  const n = e.tonos.length, mitad = (n - 1) / 2, paradas = [];
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    const val = t <= .5 ? e.lo + (e.piv - e.lo) * (t / .5)
                        : e.piv + (e.hi - e.piv) * ((t - .5) / .5);
    paradas.push(val, e.tonos[i]);
  }
  // saneo: las paradas deben ser estrictamente crecientes o MapLibre tira error
  for (let i = 2; i < paradas.length; i += 2)
    if (paradas[i] <= paradas[i-2]) paradas[i] = paradas[i-2] + 1e-9;
  return ["case", ["==", ["get", campo], null], SIN_DATO[esOscuro() ? "oscuro" : "claro"],
          ["interpolate", ["linear"], ["to-number", ["get", campo]], ...paradas]];
}

/* ── FORMATO ─────────────────────────────────────────────────────────────── */
const nf = (v, d) => v === null || v === undefined || !isFinite(v) ? "s/d"
  : (+v).toLocaleString("es-BO", {minimumFractionDigits: d, maximumFractionDigits: d});
/* ★ LOS DECIMALES SE ELIGEN POR LA MAGNITUD, no fijos en uno.
   Con un decimal fijo, 99 de los 343 municipios se mostraban como
   "0,0 hab/ha" y NINGUNO es cero: el menor tiene 0,00222. Un valor no nulo
   impreso como cero no es un redondeo, es otro dato — y encima el que un
   lector interpretaría como "acá no vive nadie".
   Las RAZONES (densidad, personas por hogar, masculinidad) son continuas por
   construcción —un conteo dividido por una superficie o por otro conteo— así
   que el decimal les corresponde; lo que no corresponde es que sea siempre el
   mismo. Por debajo de 1 se muestran dos cifras significativas.
   Los CONTEOS (hab, viv) siguen sin decimales: ahí sí sería inventar precisión. */
function decimales(v, u){
  if (u === "%" || u === "pp") return 1;
  const a = Math.abs(v);
  if (a === 0) return 0;
  if (a >= 100) return 0;
  if (a >= 1) return 1;
  // dos cifras significativas: 0,42 · 0,067 · 0,0022
  return Math.min(6, 1 - Math.floor(Math.log10(a)));
}
function fmt(v, u){
  if (v === null || v === undefined || !isFinite(v)) return "s/d";
  if (u === "hab" || u === "viv") return nf(Math.round(v), 0);
  if (u === "%") return nf(v, 1) + "%";
  if (u === "pp") return (v > 0 ? "+" : "") + nf(v, 1) + " pp";
  return nf(v, decimales(v, u)) + (u ? " " + u : "");
}
/* En modo Cambio el signo es parte del dato: un avance y un retroceso del mismo
   tamaño son cosas distintas, y `fmt` sólo antepone el signo para la unidad "pp".
   La unidad la decide `uMode` desde lo DECLARADO (un conteo cambia en %, un
   porcentaje en pp), no desde la unidad del indicador. */
function fmtM(v, ind){
  const u = uMode(ind);
  if (ANIO !== "cambio") return fmt(v, u);
  if (v === null || v === undefined || !isFinite(v)) return "s/d";
  return u === "pp" ? fmt(v, "pp") : (v > 0 ? "+" : "") + fmt(v, u);
}

/* ── MAPA ────────────────────────────────────────────────────────────────────
   El mapa se crea dentro de un try: si el dispositivo no da contexto WebGL
   —aceleración desactivada, drivers viejos, un headless— MapLibre TIRA en el
   constructor. Estando en el tope del script eso mataba la página entera y el
   usuario veía una pantalla en blanco en vez de perder sólo el mapa. Ahora el
   tablero degrada: el panel, la ficha y las cifras siguen funcionando. */
/* MAPA BASE. Al bajar a manzana el polígono solo no dice nada: sin calles ni
   ríos no se sabe qué barrio se está mirando y el zoom deja de tener sentido.
   Teselas CARTO (las mismas que ya usa el Observatorio Urbano), en versión
   clara y oscura para acompañar el tema. Es la única dependencia externa del
   tablero además de la tipografía. */
const BASE = {
  claro: "https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
  oscuro: "https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
};
const ATRIB = '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/attributions">CARTO</a>';
/* Las DOS bases van en el estilo desde el arranque y se alterna la visibilidad.
   Cambiar de tema con `setStyle()` sería lo obvio y está mal: eso reemplaza el
   estilo entero y se lleva puestas las capas de municipios y manzanas, que
   habría que volver a agregar y repintar. */
function estiloBase(oscuro){
  const raster = (id, url, vis, op) => ({
    id, type: "raster", source: id, layout: {visibility: vis},
    paint: {"raster-opacity": op, "raster-saturation": -.78}
  });
  return {
    version: 8,
    sources: {
      base_claro: {type: "raster", tiles: [BASE.claro], tileSize: 256, attribution: ATRIB},
      base_oscuro: {type: "raster", tiles: [BASE.oscuro], tileSize: 256, attribution: ATRIB},
    },
    layers: [
      {id: "fondo", type: "background",
       paint: {"background-color": oscuro ? "#12181c" : "#eeebe1"}},
      raster("base_claro", BASE.claro, oscuro ? "none" : "visible", .92),
      raster("base_oscuro", BASE.oscuro, oscuro ? "visible" : "none", .78),
    ]
  };
}
try {
  /* El protocolo `pmtiles://` se registra ANTES de construir el mapa: si una
     fuente lo usa y el protocolo no está, MapLibre falla al resolverla y la
     capa queda muda sin error visible. GitHub Pages responde `Accept-Ranges:
     bytes` (verificado con un 206), que es lo que hace que el navegador pida
     sólo el pedazo del archivo que necesita en vez de los 11,5 MB. */
  if (window.pmtiles && !maplibregl.__pm){
    maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
    maplibregl.__pm = 1;
  }
  map = new maplibregl.Map({
    container: "map",
    style: estiloBase(esOscuro()),
center: [-63.05, -17.72], zoom: 9.2, attributionControl: {compact: true},
    maxZoom: 18, minZoom: 7
  });
  const ctrl = document.querySelector(".maplibregl-ctrl-top-right");
  if (ctrl) ctrl.style.display = "none";
} catch (err) {
  sinMapa = true;
  console.warn("Sin contexto WebGL: el mapa no se dibuja, el resto sí.", err);
  document.getElementById("map").innerHTML =
    '<div style="display:grid;place-items:center;height:100%;padding:2rem;text-align:center;' +
    'color:var(--suave);font-size:.78rem;line-height:1.6">Este navegador no pudo iniciar el mapa' +
    ' (WebGL no disponible).<br>Los indicadores y las cifras de la derecha siguen funcionando.</div>';
}
document.getElementById("z-in").onclick = () => map && map.zoomIn();
document.getElementById("z-out").onclick = () => map && map.zoomOut();
document.getElementById("z-rst").onclick = () => encuadrar();

/* Bandera puesta APENAS se construye el mapa, antes de cualquier fetch: es la
   única forma de no perder el evento. `map.loaded()` no sirve como sustituto
   —devuelve false mientras falten teselas del mapa base, aunque `load` ya haya
   disparado hace rato— y suscribirse tarde a un evento que ya ocurrió deja las
   capas sin agregar y el mapa vacío, sin ningún error en consola. */
let mapListo = false;
if (map) map.on("load", () => { mapListo = true; });

/* No se espera UN evento: se INTENTA, y si el estilo todavía no está se
   reintenta con cada señal que MapLibre emita. Depender sólo de `load` falló de
   dos formas distintas: si ya había disparado, suscribirse llegaba tarde; y en
   contextos donde el WebGL es limitado `load` / `style.load` / `isStyleLoaded()`
   no llegan nunca, así que las capas no se agregaban jamás y el mapa quedaba
   con el fondo solo, sin un error que lo delatara. Intentar y reintentar es
   feo de leer y es lo único que se comporta igual en todos lados. */
function cuandoListo(fn){
  if (!map) return;
  let hecho = false;
  const intenta = () => {
    if (hecho) return true;
    try {
      fn();
      hecho = true;
      mapListo = true;
      return true;
    } catch (e) {
      return false;           // el estilo aún no acepta capas
    }
  };
  if (intenta()) return;
  ["load", "style.load", "styledata", "idle"].forEach(ev => map.on(ev, intenta));
  let intentos = 0;
  const t = setInterval(() => {
    if (intenta() || ++intentos > 40) clearInterval(t);
  }, 150);
}

/* bbox de cualquier geometría GeoJSON, sin suponer si es Polygon o MultiPolygon:
   se baja hasta encontrar pares [lon,lat]. */
/* URL absoluta del archivo de teselas. Tiene que ser absoluta porque el
   protocolo `pmtiles://` no resuelve rutas relativas al documento. */
function urlPM(){ return new URL("../datos/manzanas.pmtiles", location.href).href; }

function bboxDe(coords){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  (function rec(a){
    if (typeof a[0] === "number"){
      if (a[0] < x0) x0 = a[0]; if (a[0] > x1) x1 = a[0];
      if (a[1] < y0) y0 = a[1]; if (a[1] > y1) y1 = a[1];
    } else a.forEach(rec);
  })(coords);
  return isFinite(x0) ? [[x0, y0], [x1, y1]] : null;
}

let BBOX = null;
/* ⚠️ SE PROBÓ ENCUADRAR SÓLO LA CONURBACIÓN (dejando Pailón fuera del cuadro)
   y SE REVIRTIÓ, por dos razones medidas:
   1. No servía. La conurbación mide 94 km de ancho pero **138 km de alto**, y
      con los dos paneles el alto útil son ~390 px: `cameraForBounds` devolvía
      z 7,7 — MÁS LEJOS que el encuadre de los nueve. Excluir Pailón acorta el
      ancho y no toca el alto, que es el que manda.
   2. No era lo pedido. Lo que hace falta es ver las manzanas SIN acercarse
      tanto, y eso lo resuelve bajar la banda del cruce, no acercar la apertura.
   ⚠️ Al medir un encuadre hay que mirar las DOS dimensiones: yo medí sólo el
   ancho y la conclusión se dio vuelta al mirar el alto. */
function encuadrar(){ if (BBOX && map) map.fitBounds(BBOX, {padding: {top: 80, bottom: 150, left: 40, right: 40}, duration: 700}); }

/* TOOLTIP. Es un div propio y no el `Popup` de MapLibre: el Popup impone su
   contenedor, su flecha y su cierre, y para vestirlo como el resto del
   ecosistema había que pelearle el estilo. El molde `#pop` (.pn/.pd/.pv/.pr) ya
   viene extraído del Atlas en `estilo-atlas.css`, así que el tooltip de acá se
   lee igual que el del Atlas Socioeconómico y el Fiscal — que es justamente lo
   que hace que el ecosistema se sienta uno. */
const popEl = document.getElementById("pop");

/* ── CARGA ───────────────────────────────────────────────────────────────── */
Promise.all([
  /* ⚠️ ESTE ARCHIVO ES LA PLANTILLA de los dos tableros (ver
     `scripts/generar_sitios.py`), pero también es una página servible: es lo que
     responde `/scz-metropolitana/web/`. Apuntaba al pipeline VIEJO
     (`catalogo_tablero.json` + `municipios.json`): 193 indicadores anteriores a
     toda la validación y con el denominador equivocado, publicados sin que nadie
     los mirara. Ahora la plantilla lee los MISMOS archivos validados que el
     tablero municipal, así lo que se sirve por defecto no es una versión vieja.
     `catalogo_tablero.json` sigue existiendo en disco porque `armar_tableros.py`
     lo lee para heredar el bloque fiscal; lo que ya no hace es servirse. */
  fetch("../datos/catalogo_municipal.json").then(r => r.json()),
  fetch("../datos/municipios_municipal.json").then(r => r.json()),
  fetch("../datos/fiscal.json").then(r => r.json()),
  fetch("../datos/municipios.geojson").then(r => r.json()),
  fetch("../datos/region.geojson").then(r => r.json()),
  fetch("../datos/mini.json").then(r => r.json()),
]).then(async ([cat, mun, fis, gmun, greg, mini]) => {
  CAT = cat; MUN = mun; FIS = fis; MINI = mini;
  /* Las estadísticas del nivel manzana (10 KB gzip) son lo que reemplaza a los
     24,1 MB de datos crudos: con teselas el cliente ya no puede calcular
     cuantiles sobre todas las manzanas porque sólo ve las de la pantalla.
     Se piden DESPUÉS del catálogo porque hasta acá no se sabe si este tablero
     tiene nivel manzana — el municipal no lo tiene y no debe pedir nada. */
  if (CAT.niveles && CAT.niveles.manzana)
    MZS = await fetch("../datos/mz_stats.json").then(r => r.json()).catch(() => null);
  anio_i = FIS.anios.length - 1;
  MUN.forEach(m => { m.geom = gmun.features.find(f => f.properties.sigep === m.sigep); });

  // `.flat(3)` NO alcanza para un MultiPolygon: deja arrays anidados adentro y
  // los mínimos/máximos salían basura — el mapa arrancaba encuadrado sobre
  // Chuquisaca. Se recorre hasta llegar a los pares de números, sin suponer
  // profundidad.
  BBOX = bboxDe(greg.features[0].geometry.coordinates);

  // El PANEL se monta apenas llegan los datos, sin esperar al mapa. Tenerlo
  // dentro de `map.on("load")` lo ataba al contexto WebGL: si la GPU no da
  // (headless, drivers viejos, un móvil con aceleración desactivada) la página
  // quedaba en blanco entera en vez de perder sólo el mapa. Además así el
  // catálogo es verificable sin navegador con GPU.
  montarCategorias();
  /* El conmutador de censo se apaga si el catálogo no trae serie: en el tablero
     de manzana ningún indicador tiene `s12` —las fichas por manzano son sólo de
     2024— y ofrecer un botón que no puede hacer nada es peor que no tenerlo. */
  if (haySerie())
    anioSeg.querySelectorAll("button").forEach(b =>
      b.onclick = e => { e.stopPropagation(); setAnio(b.dataset.a); });
  else
    anioSeg.style.display = "none";
  elegirCategoria(CAT.grupos[0].key);
  actualizarCobertura();
  document.body.setAttribute("data-listo", JSON.stringify({
    grupos: CAT.grupos.length,
    indicadores: CAT.grupos.reduce((a, g) => a + g.indicadores.length, 0),
    // se publica la serie MEDIDA, que es la que hay que poder verificar sin abrir
    // el navegador: el flag viejo decía 238 de 240 sobre 176 reales
    con_serie_2012: CAT.grupos.reduce((a, g) =>
      a + g.indicadores.filter(i => i.s12).length, 0),
    municipios: MUN.length, gestiones: FIS.anios.length
  }));

  /* ⚠ NO usar `map.on("load", …)` acá. Este código corre dentro del .then() de
     los fetch, y con un estilo inline sin teselas MapLibre dispara `load` casi
     de inmediato — normalmente ANTES de que los datos lleguen. `load` se emite
     una sola vez: suscribirse después es suscribirse a algo que ya pasó, y las
     capas no se agregaban nunca. El mapa quedaba vacío sin ningún error. */
  if (map) cuandoListo(() => {
    /* Idempotente a propósito: `cuandoListo` puede reintentar esta función
       entera, y si al segundo intento `addSource` tirara "ya existe" el bloque
       quedaría a medias para siempre — las capas de manzanas nunca se
       agregarían y el mapa se vería gris de "sin dato". */
    const nuevaFuente = (id, def) => { if (!map.getSource(id)) map.addSource(id, def); };
    const nuevaCapa = def => { if (!map.getLayer(def.id)) map.addLayer(def); };
    nuevaFuente("region", {type: "geojson", data: greg});
    nuevaCapa({id: "region-halo", type: "line", source: "region",
      paint: {"line-color": "#8aa0ab", "line-width": 1.2, "line-opacity": .5}});
    nuevaFuente("mun", {type: "geojson", data: gmun, promoteId: "sigep"});
    // Opacidades pensadas para que el mapa base se vea DEBAJO: a nivel municipio
    // el relleno manda (son 9 áreas grandes y la referencia importa poco); a
    // nivel manzana se afloja, porque ahí la calle de al lado es justamente el
    // dato que le falta al lector para ubicarse.
    nuevaCapa({id: "mun-fill", type: "fill", source: "mun",
      paint: {"fill-color": SIN_DATO.claro,
              "fill-opacity": hayManzana() ? fundidoMun(opacidades().mun) : opacidades().mun}});
    /* ★ EL BORDE MUNICIPAL SOBREVIVE AL RELLENO. Cuando el coroplético
       municipal se apaga, el contorno se queda a media tinta hasta bastante
       más arriba: es lo que evita que al bajar a manzana se pierda la
       referencia de en qué municipio estás. Misma solución que usa el tablero
       de desarrollo infantil, donde el relleno se va en una banda angosta y el
       borde aguanta dos niveles más. */
    nuevaCapa({id: "mun-line", type: "line", source: "mun",
      paint: {"line-color": esOscuro() ? "#12181c" : "#ffffff",
              "line-width": ["interpolate", ["linear"], ["zoom"], Z0, 1.1, Z1, 1.6],
              "line-opacity": hayManzana()
                ? ["interpolate", ["linear"], ["zoom"], Z0, .55, Z1, .4, 15.5, 0] : .55}});
    nuevaCapa({id: "mun-sel", type: "line", source: "mun",
      paint: {"line-color": SENAL, "line-width": 2.4},
      filter: ["==", ["get", "sigep"], ""]});
    /* ★ TESELAS VECTORIALES, NO GeoJSON. Antes acá entraba una colección de
       38.892 polígonos con un único campo `v` que había que REESCRIBIR entero
       en cada cambio de indicador: `setData()` reserializaba 12,1 MB y
       MapLibre reteselaba todo el nivel por cambiar un color.
       Ahora los 59 indicadores viajan como ATRIBUTOS dentro de la tesela, el
       navegador baja sólo el pedazo que mira, y cambiar de indicador es
       cambiar la expresión de color. Ver `scripts/generar_pmtiles.py`. */
    if (hayManzana()){
      nuevaFuente("mz", {type: "vector", url: "pmtiles://" + urlPM(),
                         minzoom: 10, maxzoom: 14});
      nuevaCapa({id: "mz-fill", type: "fill", source: "mz", "source-layer": "manzanas",
        minzoom: Z0,
        paint: {"fill-color": SIN_DATO.claro,
                "fill-opacity": fundidoMz(opacidades().mz)}});
      nuevaCapa({id: "mz-line", type: "line", source: "mz", "source-layer": "manzanas",
        minzoom: Z0,
        paint: {"line-color": esOscuro() ? "#12181c" : "#ffffff",
                "line-width": ["interpolate", ["linear"], ["zoom"], 12, .15, 15, .7],
                "line-opacity": ["interpolate", ["linear"], ["zoom"], Z0, 0, Z1, .3]}});
    }
    encuadrar();
    interacciones();
    vigilarZoom();            // el nivel es función del zoom: hay que escucharlo
    pintar();                 // el panel ya eligió indicador; acá recién hay capas
    /* Ya no hay nada que precargar. Antes acá se bajaban los nueve pares
       geo+dat en segundo plano —24,1 MB descomprimidos— para que el botón de
       nivel no se sintiera trabado. Sin botón y con teselas, MapLibre pide lo
       que entra en pantalla cuando el zoom lo pide. */
  });
});

/* ── PANEL DE CATEGORÍAS E INDICADORES ───────────────────────────────────── */
function montarCategorias(){
  const d = document.getElementById("cat-drop");
  d.innerHTML = CAT.grupos.map(g =>
    `<div class="cat-op" data-g="${g.key}"><span>${g.label}</span><span class="co-n">${g.indicadores.length}</span></div>`).join("");
  d.querySelectorAll(".cat-op").forEach(o => o.onclick = () => {
    elegirCategoria(o.dataset.g);
    document.getElementById("cat-bar").classList.remove("open");
  });
  const bar = document.getElementById("cat-bar");
  document.getElementById("cat-btn").onclick = e => { e.stopPropagation(); bar.classList.toggle("open"); };
  document.addEventListener("click", () => bar.classList.remove("open"));
}
function elegirCategoria(key){
  cat_actual = CAT.grupos.find(g => g.key === key) || CAT.grupos[0];
  document.querySelector("#cat-btn .cn").textContent = cat_actual.label;
  document.querySelectorAll("#cat-drop .cat-op").forEach(o =>
    o.classList.toggle("on", o.dataset.g === cat_actual.key));
  montarIndicadores();
  /* Al entrar a una categoría se elige uno que SE PUEDA MIRAR en el censo en
     pantalla. Sin esto, en 2012 varias categorías abrían con un mapa gris y el
     lector tenía que adivinar que el problema era el indicador y no el año. */
  const primero = cat_actual.indicadores.find(i => disponible(i) && !mudo(i))
               || cat_actual.indicadores.find(i => disponible(i))
               || cat_actual.indicadores[0];
  if (primero) elegirIndicador(primero.key);
  // ⚠️ El conteo se SACA DE LOS DATOS. Estaba escrito a mano ("193 indicadores")
  //    y al cambiar de catálogo siguió mostrando 193 sobre 210, sin fallar.
  actualizarPistas();
}
/* Un indicador está disponible si existe en el nivel activo. */
const disponible = i => nivel === "municipio" ? !!i.k_mun : !!i.k_mz;

/* Valor del indicador para un municipio, sirva o no a nivel municipal: si el
   indicador sólo existe por manzana se usa el agregado URBANO, que es lo único
   que hay. La miniatura entonces muestra la región tal como se vería al bajar. */
function valorParaMini(m, ind){
  if (ind.k_mun) return valorMunicipal(m, ind);
  if (mudo(ind)) return null;
  return m.urbano ? m.urbano[ind.k_mz] : null;
}
/* De dónde salen los valores de la miniatura, que es lo que decide qué puede
   declararse (ver `escala`). */
const ambitoMini = ind => ind.k_mun ? "municipio" : "urbano";
/* Miniatura de la región pintada con el indicador de la tarjeta, igual que en
   los atlas nacionales: 9 siluetas precalculadas en un lienzo 100×100. */
function miniSVG(ind){
  if (!MINI) return "";
  const vals = MUN.map(m => valorParaMini(m, ind));
  const pes = MUN.map(pesoMunicipal);
  const e = escala(vals, pes, ind, ambitoMini(ind));
  const p = MUN.map((m, k) => {
    const d = MINI.paths[m.sigep];
    return d ? `<path d="${d}" fill="${tonoDe(e, vals[k])}"/>` : "";
  }).join("");
  return `<svg class="mini" viewBox="${MINI.viewBox}" preserveAspectRatio="xMidYMid meet">${p}</svg>`;
}

/* Los indicadores se separan por NIVEL dentro de cada categoría. Mezclados, el
   lector no sabe cuáles le van a servir cuando se acerque, y descubre que un
   indicador no baja recién al intentarlo. Arriba van los que llegan a la
   manzana —que son la razón de existir de este tablero— y abajo los que se
   quedan en el municipio. */
// ★ Este mismo archivo sirve los DOS tableros (ver scripts/generar_sitios.py).
//   Todo lo que distingue el nivel —el badge de la tarjeta, los separadores de la
//   lista, el conmutador— se decide por el CATÁLOGO, no por copias del código:
//   en un tablero de un solo nivel, repetir "sólo municipio" 210 veces no informa
//   nada y "Sólo a nivel municipio · 12" separa una lista que no está partida.
const hayManzana = () => !!(CAT.niveles && CAT.niveles.manzana);

/* El motivo de la ausencia, siempre con una frase de reserva: un indicador
   apagado sin explicación es una caja negra —el lector no puede saber si el censo
   no lo trae o si no lo hicimos— y eso es peor que no apagarlo. */
const motivoSinSerie = i => i.w12 || "Sin cifra comparable para el censo de 2012.";

function tarjeta(i, n){
  const ok = disponible(i);
  const sinSerie = mudo(i);
  const dosNiveles = hayManzana();
  const badge = i.nivel === "ambos" ? '<span class="co-n">municipio + manzana</span>'
    : i.nivel === "manzana" ? '<span class="co-n">sólo manzana</span>'
    : i.fuente === "fiscal" ? '<span class="co-n">fiscal · 10 gestiones</span>'
    : dosNiveles ? '<span class="co-n">sólo municipio</span>' : '';
  return `<div class="ind${ok ? "" : " off"}${sinSerie ? " sin12" : ""}" data-k="${i.key}" style="--d:${Math.min(n,14)*14}ms">
    <div>${sinSerie ? '<span class="i-tag">Sólo 2024</span>' : ""}<div class="i-nm">${i.label}</div>
    <div class="i-df">${sinSerie ? motivoSinSerie(i) : (i.desc || "")}</div>${badge}</div>
    ${miniSVG(i)}</div>`;
}
function montarIndicadores(){
  const l = document.getElementById("lista");
  const baja = cat_actual.indicadores.filter(i => i.k_mz);
  const nobaja = cat_actual.indicadores.filter(i => !i.k_mz);
  let h = "", n = 0;
  const sep = hayManzana();
  if (baja.length){
    if (sep) h += `<div class="nivsep">Con detalle por manzana · ${baja.length}</div>`;
    h += baja.map(i => tarjeta(i, n++)).join("");
  }
  if (nobaja.length){
    if (sep) h += `<div class="nivsep">Sólo a nivel municipio · ${nobaja.length}</div>`;
    h += nobaja.map(i => tarjeta(i, n++)).join("");
  }
  l.innerHTML = h;
  l.querySelectorAll(".ind").forEach(el => el.onclick = () => elegirIndicador(el.dataset.k));
  marcarActivo();
}
function marcarActivo(){
  document.querySelectorAll("#lista .ind").forEach(el =>
    el.classList.toggle("on", el.dataset.k === (ind_actual && ind_actual.key)));
}

function elegirIndicador(key){
  const i = cat_actual.indicadores.find(x => x.key === key);
  if (!i) return;
  ind_actual = i;
  marcarActivo();
  actualizarSubtitulo();

  /* Ya no hay botón que apagar: si el indicador no baja de nivel y el zoom
     está abajo, la capa de manzanas queda sin color y el nivel lógico vuelve
     a municipio. En el tablero de manzana esto no se dispara nunca —los 59
     tienen los dos niveles— pero la guarda no cuesta nada. */
  if (!i.k_mz && nivel === "manzana") nivel = "municipio";

  document.getElementById("anios").classList.toggle(
    "on", i.fuente === "fiscal" && ANIO === "2024");
  if (i.fuente === "fiscal") montarAnios();
  avisar(i);
  pintar();
}
function montarAnios(){
  const a = document.getElementById("anios");
  a.innerHTML = FIS.anios.map((y, n) =>
    `<button data-i="${n}" class="${n === anio_i ? "on" : ""}">${y}</button>`).join("");
  a.querySelectorAll("button").forEach(b => b.onclick = () => {
    anio_i = +b.dataset.i; montarAnios(); pintar();
  });
}
function avisar(i){
  const el = document.getElementById("aviso");
  let txt = "";
  if (!i){ el.innerHTML = ""; el.classList.remove("on"); return; }
  if (mudo(i))
    /* Va primero y gana a los demás avisos: si el mapa está gris, por qué está
       gris es lo único que hace falta leer. */
    txt = `<b>${ANIO === "cambio" ? "Sin cambio que mostrar." : "Sin cifra para 2012."}</b> `
        + motivoSinSerie(i);
  else if (i.fuente === "fiscal")
    txt = "<b>No baja a manzana.</b> No existe ejecución presupuestaria por manzano: el dato fiscal se publica por municipio.";
  else if (i.par_manzana)
    txt = `<b>Cambia de definición al bajar.</b> ${i.par_manzana.nota}`;
  else if (i.par_municipal)
    txt = `<b>Cambia de definición al subir.</b> ${i.par_municipal.nota}`;
  else if (i.nivel === "manzana")
    txt = "<b>Sólo existe a nivel de manzana.</b> No tiene equivalente publicado por municipio.";
  el.innerHTML = txt;
  el.classList.toggle("on", !!txt);
}

/* ── CENSO ───────────────────────────────────────────────────────────────────
   El conmutador se APAGA solo si el catálogo no trae serie censal: así el mismo
   archivo sirve el tablero municipal (176 indicadores con 2012) y el de manzana
   (ninguno: las fichas por manzano son sólo de 2024), sin copias del código.
   Es el mismo criterio con que `hayManzana()` decide los separadores de nivel. */
const anioSeg = document.getElementById("anio-seg");
function setAnio(a){
  if (a === ANIO) return;
  ANIO = a;
  anioSeg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.a === a));
  /* Las tarjetas se rehacen porque su miniatura, su descripción y su estado de
     apagado dependen del censo en pantalla. */
  montarIndicadores();
  actualizarPistas();
  /* El selector de gestiones no tiene sentido fuera de 2024: el indicador fiscal
     queda mudo, así que ofrecerle diez años a un mapa gris es ruido. */
  document.getElementById("anios").classList.toggle(
    "on", !!ind_actual && ind_actual.fuente === "fiscal" && ANIO === "2024");
  avisar(ind_actual);
  pintar();
}
/* Cuántos indicadores se pueden mirar en el censo en pantalla. Sale de MEDIR
   `s12`, no de un total escrito a mano: el conteo cableado ("193 indicadores")
   ya sobrevivió una vez a un cambio de catálogo mostrando el número viejo. */
function actualizarPistas(){
  const total = CAT.grupos.reduce((a, g) => a + g.indicadores.length, 0);
  const con12 = CAT.grupos.reduce((a, g) => a + g.indicadores.filter(i => i.s12).length, 0);
  document.getElementById("kick-n").textContent = ANIO === "2024"
    ? `${CAT.grupos.length} categorías · ${total} indicadores`
    : `${CAT.grupos.length} categorías · ${con12} con serie 2012`;
  const ts = document.getElementById("t-s");
  if (ts) ts.innerHTML = (ANIO === "cambio" ? "Cambio 2012→2024" : "Censo " + ANIO)
    + ` · <b>${MUN.length} municipios</b>`;
  actualizarSubtitulo();
}
/* Un solo dueño del subtítulo del panel, porque hay tres cosas que quieren
   escribirlo y antes se pisaban: en 2024 manda la definición del indicador; con
   un indicador mudo manda el MOTIVO —que es lo que el lector necesita justo
   entonces— y si no, cuánto de la categoría se puede mirar en ese censo. */
function actualizarSubtitulo(){
  const el = document.getElementById("p-sub");
  const i = ind_actual;
  if (ANIO === "2024"){
    el.textContent = i ? (i.desc || i.label) : "elegí un indicador para verlo en el mapa";
    return;
  }
  if (i && mudo(i)){ el.textContent = motivoSinSerie(i); return; }
  const n = cat_actual.indicadores.filter(x => x.s12).length;
  const N = cat_actual.indicadores.length;
  el.textContent =
      n === 0 ? `ninguno de los ${N} de esta categoría tiene cifra de 2012`
    : n === N ? `los ${n} tienen serie 2012 · elegí uno para verlo en el mapa`
    : `${n} de ${N} con serie 2012 · los demás quedan apagados`;
}

/* ── NIVEL: LO DECIDE EL ZOOM, NO UN BOTÓN ───────────────────────────────
   El conmutador se fue. `nivel` dejó de ser algo que el usuario cambia y pasó
   a ser una FUNCIÓN del zoom: cruzando ZC, la leyenda, el panel y el tooltip
   pasan a hablar de manzanas. El fundido de los rellenos lo hace MapLibre solo
   con expresiones de zoom, así que acá no hay nada que animar — sólo que
   redibujar lo que está fuera del mapa cuando el nivel efectivo cambia. */
function nivelDeZoom(z){
  return hayManzana() && z >= ZC ? "manzana" : "municipio";
}
function vigilarZoom(){
  if (!map) return;
  const revisar = () => {
    const n = nivelDeZoom(map.getZoom());
    if (n === nivel) return;
    nivel = n;
    // el indicador puede no existir en el nivel nuevo (en el tablero de
    // manzana no pasa nunca —los 59 están en los dos—, pero la guarda queda
    // por si algún día entra uno que sólo viva arriba)
    if (ind_actual && !disponible(ind_actual)){
      const alt = cat_actual.indicadores.find(disponible);
      if (alt) return elegirIndicador(alt.key);
    }
    actualizarCobertura();
    montarIndicadores();
    pintar();
  };
  map.on("zoomend", revisar);
  map.on("moveend", revisar);
}
function actualizarCobertura(){
  const el = document.getElementById("cober");
  if (el && CAT.niveles[nivel]) el.textContent = CAT.niveles[nivel].cobertura;
}

/* `cambiarNivel`, `aplicarNivelAlMapa` y `cargarManzanas` se eliminaron con el
   conmutador. La carga perezosa de los nueve pares geo+dat (24,1 MB que había
   que bajar y parsear enteros para ver un indicador) la reemplaza el protocolo
   de teselas: MapLibre pide las teselas del viewport y nada más.
   La visibilidad de cada capa la resuelven `minzoom` y las expresiones de
   `fill-opacity` declaradas al montarlas. */

function buscarPorClave(k){
  for (const g of CAT.grupos)
    for (const i of g.indicadores)
      if (i.k_mun === k || i.k_mz === k) return i;
  return null;
}
function elegirCategoriaDe(ind){
  const g = CAT.grupos.find(g => g.indicadores.includes(ind));
  if (g && g.key !== cat_actual.key){
    cat_actual = g;
    document.querySelector("#cat-btn .cn").textContent = g.label;
    montarIndicadores();
  }
}

/* ── VALORES ─────────────────────────────────────────────────────────────── */
function valorMunicipal(m, ind){
  if (!ind.k_mun) return null;
  /* El mudo va PRIMERO, antes de la rama fiscal: los 30 indicadores fiscales no
     tienen lectura censal de 2012 (`s12:false`), así que fuera de 2024 devuelven
     null y el mapa queda gris con el motivo escrito, en vez de mostrar una
     gestión del MEFP como si fuera un censo. */
  if (mudo(ind)) return null;
  if (ind.fuente === "fiscal"){
    const e = FIS.entidades[m.sigep];
    const s = e && e.s && e.s[ind.k_mun];
    return s ? s[anio_i] : null;
  }
  const v24 = m.municipal ? m.municipal[ind.k_mun] : null;
  if (ANIO === "2024") return v24 === undefined ? null : v24;
  const v12 = m.municipal_2012 ? m.municipal_2012[ind.k_mun] : null;
  if (ANIO === "2012") return v12 === undefined ? null : v12;
  return difIntercensal(v12, v24, ind);
}
/* La población que se rotula es la del censo EN PANTALLA. En modo Cambio se usa
   la de 2024, que es la actual, y el rótulo lo dice. */
function poblacionDe(m){
  const c = ANIO === "2012" ? m.municipal_2012 : m.municipal;
  const v = c ? c.pob_total : null;
  return v === null || v === undefined || !isFinite(v) ? (m.personas_urbano || 0) : v;
}
/* Para un CONTEO la magnitud de la región es la SUMA de los 9. El agregado que
   viaja en `region` es un promedio ponderado y para un conteo no significa nada,
   así que la suma se hace del dato. */
function sumaRegion(ind, caja){
  let t = null;
  for (const m of MUN){
    const v = m[caja] ? m[caja][ind.k_mun] : null;
    if (v === null || v === undefined || !isFinite(v)) continue;
    t = (t || 0) + v;
  }
  return t;
}
/* La cifra de la REGIÓN contra la que se lee un municipio, en el censo que esté
   en pantalla.
   ★ EL CAMBIO DE LA REGIÓN ES LA DIFERENCIA DE LOS DOS AGREGADOS, no el promedio
     de los 9 cambios: promediar cambios le daría el mismo peso a Colpa Bélgica
     (5.700 habitantes) que a la capital (1,7 millones). */
function refRegion(ind){
  if (!CAT.region || !ind.k_mun) return null;
  const conteo = esConteo(ind);
  const agg = anio => {
    if (conteo) return sumaRegion(ind, anio === "2012" ? "municipal_2012" : "municipal");
    const caja = anio === "2012" ? CAT.region.municipal_2012 : CAT.region.municipal;
    const v = caja ? caja[ind.k_mun] : null;
    return v === undefined || v === null || !isFinite(v) ? null : v;
  };
  if (ANIO === "cambio")
    return {v: difIntercensal(agg("2012"), agg("2024"), ind), tipo: "cambio de la región"};
  return {v: agg(ANIO), tipo: conteo ? "total de la región" : "región"};
}
function pesoMunicipal(m){
  if (ind_actual && ind_actual.fuente === "fiscal"){
    const e = FIS.entidades[m.sigep];
    return e && e.pob ? e.pob[anio_i] : 0;
  }
  return m.municipal ? (m.municipal.pob_total || m.personas_urbano) : m.personas_urbano;
}

/* ── PINTAR ──────────────────────────────────────────────────────────────── */
function pintar(){
  if (!ind_actual) return;
  const i = ind_actual;
  /* La precondición para pintar es que la FUENTE exista, y nada más.
     Tener `isStyleLoaded()` en esta condición fue el error que más costó
     encontrar: en contextos con WebGL limitado devuelve false para siempre, así
     que las capas se agregaban bien pero `pintar()` se saltaba el mapa entero y
     todo quedaba del gris de "sin dato", sin ningún error. */
  const conMapa = !!map && !!map.getSource("mun");
  if (conMapa){
    map.setPaintProperty("fondo", "background-color", esOscuro() ? "#12181c" : "#eeebe1");
  }

  let e = null;
  /* El coroplético municipal se pinta SIEMPRE, aunque el nivel lógico sea
     manzana: durante el fundido las dos capas conviven en pantalla y la de
     abajo no puede quedar del gris de "sin dato". */
  if (conMapa && map.getSource("mun")){
    const vm = MUN.map(m => valorMunicipal(m, i));
    const em = escala(vm, MUN.map(pesoMunicipal), i, "municipio");
    const src = map.getSource("mun"), d = src._data;
    d.features.forEach(f => {
      const m = MUN.find(x => x.sigep === f.properties.sigep);
      f.properties.v = m ? valorMunicipal(m, i) : null;
    });
    src.setData(d);
    if (em) map.setPaintProperty("mun-fill", "fill-color", expresionColor(em, "v"));
  }

  if (nivel === "municipio"){
    const vals = MUN.map(m => valorMunicipal(m, i));
    const pes = MUN.map(pesoMunicipal);
    e = escala(vals, pes, i, "municipio");   // ya pintado arriba
  } else {
    /* ★ ACÁ ESTABA EL COSTO. Antes este bloque recorría los 38.892 polígonos
       reescribiendo `properties.v` y llamaba `setData()`: 12,1 MB
       reserializados y todo el nivel reteselado por cambiar un color.
       Ahora el valor ya vive en la tesela con el nombre del indicador, así que
       basta apuntar la expresión de color a otro atributo. */
    e = escalaManzana(i);
    if (conMapa && map.getLayer("mz-fill"))
      map.setPaintProperty("mz-fill", "fill-color", expresionColor(e, i.k_mz));
  }
  ESC = e;
  termometro(e, i);
  ficha(e, i);
}

/* ── LEYENDA ─────────────────────────────────────────────────────────────── */
function termometro(e, i){
  const u = uMode(i);
  const eti = ANIO === "cambio" ? " · cambio 2012→2024" : ANIO === "2012" ? " · censo 2012" : "";
  document.getElementById("tm-t").innerHTML =
    `${i.label} <small>${u || ""}${eti}</small>`;
  const bar = document.getElementById("tm-bar");
  if (!e){ bar.style.background = "var(--linea)";
    document.getElementById("tm-lo").textContent = "";
    document.getElementById("tm-hi").textContent = "";
    // el motivo también acá: la leyenda es donde el lector va a buscar por qué el
    // mapa no dice nada, y "sin datos" no distingue un hueco de una imposibilidad
    document.getElementById("tm-st").textContent =
      mudo(i) ? motivoSinSerie(i) : "sin datos"; return; }
  bar.style.background = `linear-gradient(to right,${e.tonos.join(",")})`;
  const cap = e.recorte;
  document.getElementById("tm-lo").innerHTML = `<span class="cap">${cap ? "≤ " : ""}</span>${fmtM(e.lo, i)}`;
  document.getElementById("tm-hi").innerHTML = `<span class="cap">${cap ? "≥ " : ""}</span>${fmtM(e.hi, i)}`;
  bar.querySelectorAll(".tm-mk").forEach(m => m.remove());
  const mk = document.createElement("div"); mk.className = "tm-mk"; mk.style.left = "50%";
  bar.appendChild(mk);
  const unidad = nivel === "municipio" ? "municipios" : "manzanas con dato";
  /* ⚠️ El pivote se recorta para que no quede pegado a un borde de la rampa
     (`pad` en `escala`). Cuando eso pasa, el número dibujado YA NO ES el agregado
     de la región: publicarlo igual bajo el rótulo "región" es rebautizar un borde
     con el nombre de una estadística. Se dice el real y se nombra el recorte. */
  const rec = e.pivReal !== undefined && e.pivReal !== null
           && Math.abs(e.pivReal - e.piv) > 1e-9;
  const piv = rec ? `${e.tipo} <b>${fmtM(e.pivReal, i)}</b> <small>(escala centrada en ${fmtM(e.piv, i)})</small>`
                  : `${e.tipo} <b>${fmtM(e.piv, i)}</b>`;
  document.getElementById("tm-st").innerHTML =
    `n <b>${nf(e.n,0)}</b> ${unidad} · mín <b>${fmtM(e.min,i)}</b> · ${piv} · máx <b>${fmtM(e.max,i)}</b>`;
}

/* ── COMPARATIVO ENTRE MUNICIPIOS ────────────────────────────────────────────
   Barras horizontales, una por municipio, ordenadas por valor y pintadas con la
   MISMA escala del mapa —así el color de la barra y el del polígono coinciden y
   no hay que traducir entre los dos. La línea punteada es el pivote de la
   región, que es contra lo que se compara cada municipio.
   Se dibuja a mano en SVG y no con una librería de gráficos: son 9 barras, y
   sumar una dependencia para esto sería pagar 200 KB por nada. */
function comparativo(e, ind){
  const filas = MUN.map(m => ({m, v: valorParaMini(m, ind)}))
    .sort((a, b) => (b.v === null ? -Infinity : b.v) - (a.v === null ? -Infinity : a.v));
  const con = filas.filter(f => f.v !== null && isFinite(f.v));
  if (!con.length) return `<div class="sin">${mudo(ind) ? motivoSinSerie(ind)
    : "Sin datos para este indicador."}</div>`;

  const vmin = Math.min(0, ...con.map(f => f.v)), vmax = Math.max(...con.map(f => f.v));
  const rango = (vmax - vmin) || 1;
  /* LX deja sitio al nombre y VX corta la barra antes del borde, pero eso solo
     no alcanza: la CIFRA se dibuja después de la barra y su ancho depende de
     cuántos dígitos tenga. Con "1.610.982" se salía del lienzo. Se estima el
     ancho del texto y se ancla la etiqueta para que nunca pase de W. */
  const H = 11.5, W = 100, LX = 35, VX = 78;  // en unidades de viewBox
  const anchoTexto = s => s.length * 2.1;     // ~0,53 em a 3,9px de tipografía
  const alto = filas.length * H + 8;
  const x = v => LX + ((v - vmin) / rango) * (VX - LX);

  let s = "";
  filas.forEach((f, k) => {
    const y = k * H + 3, sel_ = f.m.sigep === sel;
    const corto = f.m.nombre.length > 16 ? f.m.nombre.slice(0, 15) + "…" : f.m.nombre;
    s += `<text x="0" y="${y + 5.4}" class="cmp-n${sel_ ? " sel" : ""}">${corto}</text>`;
    if (f.v !== null && isFinite(f.v)){
      const x1 = x(f.v), txt = fmtM(f.v, ind);
      const tx = Math.min(x1 + 1.4, W - anchoTexto(txt));
      s += `<rect x="${LX}" y="${y + 1}" width="${Math.max(.6, x1 - LX)}" height="6"
              fill="${tonoDe(e, f.v)}" ${sel_ ? `stroke="${SENAL}" stroke-width="0.8"` : ""}/>`;
      s += `<text x="${tx}" y="${y + 5.4}" class="cmp-v">${txt}</text>`;
    } else {
      s += `<text x="${LX}" y="${y + 5.4}" class="cmp-v">s/d</text>`;
    }
  });
  if (e){
    const xp = x(e.piv);
    if (xp > LX && xp < VX)
      s += `<line x1="${xp}" y1="1.5" x2="${xp}" y2="${filas.length * H + 1.5}" class="cmp-piv"/>`;
  }
  return `<div class="cmp-t">Comparación entre municipios<span>${e ? e.tipo + " " + fmtM(e.pivReal != null ? e.pivReal : e.piv, ind) : ""}</span></div>
    <svg class="cmp" viewBox="0 0 ${W} ${alto}" preserveAspectRatio="xMidYMin meet">${s}</svg>`;
}

/* ── SERIE FISCAL: LAS 10 GESTIONES ──────────────────────────────────────────
   El selector de gestiones ya cambiaba el mapa, pero mostraba UNA gestión por
   vez: para ver la trayectoria había que apretar los diez años de a uno y
   acordarse de los números. Acá el municipio elegido y la región van sobre el
   mismo eje —misma unidad, así que UN solo eje: dos escalas en un gráfico
   inventan una correlación que no está en los datos— y la gestión activa queda
   marcada sobre la línea.

   La línea de la región NO es el pivote de `escala()`: ese viene recortado al
   dominio [lo+pad, hi-pad] para que la leyenda no se pegue a los extremos, y
   acá hace falta la magnitud real. Es el promedio ponderado por población de
   cada gestión, que es el mismo criterio con el que el mapa fija su pivote.

   Se dibuja a mano en SVG, igual que el comparativo y por la misma razón: son
   veinte puntos y una librería de gráficos costaría 200 KB por nada. */
/* ── DISTRIBUCIÓN DENTRO DE CADA MUNICIPIO ───────────────────────────────
   Lo que las barras de arriba NO pueden mostrar. El comparativo ordena los
   nueve promedios; esto abre cada promedio y enseña de qué manzanas está hecho.

   ★ POR QUÉ ESTÁ ACÁ, medido sobre las 38.892 manzanas: en 36 de los 59
     indicadores la brecha DENTRO de un municipio (p90−p10) es mayor que todo
     el rango ENTRE los nueve. O sea que en seis de cada diez casos el
     comparativo está retratando la MENOR de las dos desigualdades.
